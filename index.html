      </div>
      <div style="height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden">
        <div style="height:100%;width:${dribblePct}%;background:${dribbleMet ? "var(--green)" : "var(--orange)"};border-radius:99px"></div>
      </div>
    </div>` : ""}
  </div>`;

  const prevWeekKey = addDays(getMonday(todayStr()), -7);
  const prevWeek = d.weekly.find((w) => w.week === prevWeekKey) || { attempts: 0, makes: 0, points: 0, reps: 0, dribbleMin: 0, shootingPct: null };
  const hasDribbling = d.dribblingSessions.length > 0;
  const dribbleRows = (cur, prev) => hasDribbling
    ? trendRow("Dribble Pts", cur.points, cur.points, prev.points, "") +
      trendRow("DribbleUp Min", cur.dribbleMin, cur.dribbleMin, prev.dribbleMin, "")
    : "";
  const periodHasData = (p) => (p.attempts || 0) > 0 || (p.points || 0) > 0 || (p.dribbleMin || 0) > 0;

  if (periodHasData(d.thisWeek) && periodHasData(prevWeek)) {
    html += `<div class="card flush">
      <div class="section-label" style="margin:0 0 10px">This Week vs Last Week</div>
      ${trendRow("FG%", d.thisWeek.shootingPct !== null ? `${d.thisWeek.shootingPct}%` : "—", d.thisWeek.shootingPct, prevWeek.shootingPct, "pp")}
      ${trendRow("Shots", d.thisWeek.attempts, d.thisWeek.attempts, prevWeek.attempts, "")}
      ${dribbleRows(d.thisWeek, prevWeek)}
    </div>`;
  }

  if (periodHasData(d.thisMonth) && periodHasData(d.lastMonth)) {
    html += `<div class="card flush">
      <div class="section-label" style="margin:0 0 10px">${fmtMonthLabel(d.thisMonthKey)} vs Last Month</div>
      ${trendRow("FG%", d.thisMonth.shootingPct !== null ? `${d.thisMonth.shootingPct}%` : "—", d.thisMonth.shootingPct, d.lastMonth.shootingPct, "pp")}
      ${trendRow("Shots", d.thisMonth.attempts, d.thisMonth.attempts, d.lastMonth.attempts, "")}
      ${dribbleRows(d.thisMonth, d.lastMonth)}
    </div>`;
  }

  if (d.pctSpread && d.pctSpread.count >= 2) {
    html += `<div class="card" style="padding:14px 8px 6px">
      <div class="chart-title">Shooting % by Session</div>
      <div style="font-size:11px;color:var(--gray);padding:0 6px 6px">${d.pctSpread.min}–${d.pctSpread.max}% across ${d.pctSpread.count} sessions · average ${d.pctSpread.avg}%</div>
      <canvas id="chartFgSession" height="180"></canvas>
    </div>`;
  }
  // Long range needs enough attempts to mean anything; below that it is a flat
  // line at zero that makes the two real zones harder to read.
  const zonesWorthCharting = d.zoneStats.filter((z) => z.attempts >= 5);
  if (d.hasZoneData) {
    const zColor = { close: "var(--blue)", mid: "var(--orange)", long: "var(--green)" };
    const charted = d.bySession.length >= 2 && zonesWorthCharting.length >= 1;
    html += `<div class="card" style="padding:16px 12px 14px">
      <div class="chart-title" style="padding:0 4px 2px">By Distance</div>
      <div style="font-size:12px;color:var(--ink-2);padding:0 4px 10px">FG% is makes ÷ attempts. Swish % is a separate shot-quality measure, not extra makes.</div>
      ${charted ? `<canvas id="chartZoneSession" height="170"></canvas>` : ""}
      <div style="padding:${charted ? "14px" : "0"} 4px 0">
        ${d.zoneStats.filter((z) => z.attempts > 0).map((z) => {
          // Below a usable sample a percentage is noise, so say the count
          // rather than dressing 0/2 up as a headline figure.
          const thin = z.attempts < 5;
          return `<div style="margin-bottom:11px">
            <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:5px">
              <span style="font-size:13px;color:${thin ? "var(--ink-2)" : "var(--ink)"};font-weight:600">${z.label}</span>
              <span style="font-size:12.5px;color:var(--ink-2)">${thin
                ? `${z.attempts} attempt${z.attempts === 1 ? "" : "s"} — too few to read`
                : `${z.makes}/${z.attempts} · <strong style="color:var(--ink)">${z.pct}%</strong>${z.swishes > 0 ? ` · ${z.swishPct}% swish` : ""}`}</span>
            </div>
            ${thin ? "" : `<div style="height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden">
              <div style="height:100%;width:${Math.min(100, z.pct || 0)}%;background:${zColor[z.zone]};border-radius:99px"></div>
            </div>`}
          </div>`;
        }).join("")}
      </div>
    </div>`;
  }
  // Weekly views stay, but only once there are two weeks to compare.
  const weeksWithShooting = d.weekly.filter((w) => w.hasShooting).length;
  if (weeksWithShooting >= 4 && d.weekly.some((w) => w.shootingPct !== null)) {
    html += `<div class="card" style="padding:14px 8px 6px"><div class="chart-title">Shooting % by Week</div><canvas id="chartFg" height="180"></canvas></div>`;
  }
  if (weeksWithShooting >= 4) {
    html += `<div class="card" style="padding:14px 8px 6px"><div class="chart-title">Attempts vs Makes</div><canvas id="chartAttempts" height="180"></canvas></div>`;
  }
  if (d.hasZoneData && weeksWithShooting >= 4) {
    html += `<div class="card" style="padding:14px 8px 6px"><div class="chart-title">Makes by Zone, by Week</div><canvas id="chartZones" height="180"></canvas></div>`;
  }
  if (d.shotTypes.length >= 2) {
    html += `<div class="card flush">
      <div class="chart-title" style="padding:0 0 8px">By Shot Type</div>
      ${d.shotTypes.map((t) => `<div class="trend-row">
        <span class="trend-label">${esc(t.shotType)}<span style="font-size:10.5px;color:var(--gray);display:block;margin-top:1px">${t.makes}/${t.attempts} over ${t.sessions} session${t.sessions === 1 ? "" : "s"}</span></span>
        <span class="trend-value">${t.pct}%</span>
      </div>`).join("")}
    </div>`;
  }
  if (d.badgeList && d.badgeList.length) {
    html += `<div class="card flush">
      <div class="chart-title" style="padding:0 0 4px">Badges Earned</div>
      <div style="font-size:11px;color:var(--gray);margin-bottom:10px">Best grade achieved for each, across all sessions.</div>
      <div>${d.badgeList.map((b) => `<span class="badge-chip">${b.grade ? `<span class="badge-grade">${esc(b.grade)}</span>` : ""}${esc(b.name)}${b.count > 1 ? `<span class="badge-zone">×${b.count}</span>` : ""}</span>`).join("")}</div>
    </div>`;
  }


  if (d.mechanics.length > 0 || d.latestForm) {
    html += `<div class="card flush">
      <div class="chart-title" style="padding:0 0 4px">Shot Mechanics</div>
      <div style="font-size:11px;color:var(--gray);margin-bottom:10px">Latest session vs. average of previous sessions</div>`;
    const untrusted = new Set(d.suspectMechanics);
    for (const m of d.mechanics) {
      const shaky = untrusted.has(m.label);
      let delta = `<span class="trend-delta flat">—</span>`;
      if (m.priorAvg !== null) {
        const diff = m.latest - m.priorAvg;
        // Higher is better for spin rate, shot arc, and intensity. Release
        // time is a "% in range" figure on the DribbleUp screen, so higher
        // is better there too.
        if (diff > 0) delta = `<span class="trend-delta up">▲ ${diff}</span>`;
        else if (diff < 0) delta = `<span class="trend-delta down">▼ ${Math.abs(diff)}</span>`;
        else delta = `<span class="trend-delta flat">— 0</span>`;
      }
      html += `<div class="trend-row">
        <span>
          <span class="trend-label" style="${shaky ? "color:var(--ink-2)" : ""}">${m.label}</span>
          <span style="font-size:10.5px;color:var(--gray);display:block;margin-top:1px">${shaky ? "reading looks unreliable — see below" : (m.priorAvg !== null ? `prev avg ${m.priorAvg}%` : "first session")}</span>
        </span>
        <span><span class="trend-value" style="${shaky ? "color:var(--ink-2);font-weight:600" : ""}">${m.latest}%</span>${shaky ? "" : delta}</span>
      </div>`;
    }
    if (d.suspectMechanics.length) {
      html += `<div style="font-size:12px;color:var(--ink-2);line-height:1.45;margin-top:10px">
        <strong style="color:var(--ink)">Worth checking:</strong> ${d.suspectMechanics.join(" and ")} never rose above 1% in any session logged. That is more often a screenshot the parser could not read than a real result — compare one against the DribbleUp screen before coaching to it.
      </div>`;
    }
    if (d.latestForm) {
      const total = d.formCounts.Consistent + d.formCounts.Inconsistent;
      const consistentPct = total > 0 ? Math.round((d.formCounts.Consistent / total) * 100) : 0;
      html += `<div class="trend-row">
        <span>
          <span class="trend-label">Shot form</span>
          <span style="font-size:10.5px;color:var(--gray);display:block;margin-top:1px">consistent in ${d.formCounts.Consistent} of ${total} session${total === 1 ? "" : "s"} (${consistentPct}%)</span>
        </span>
        <span class="form-chip ${(d.latestForm.shotForm || "").toLowerCase() === "consistent" ? "good" : ""}">${esc(d.latestForm.shotForm)}</span>
      </div>`;
    }
    html += `</div>`;
  }

  if (d.weekly.some((w) => w.hasDribbling)) {
    html += `<div class="card" style="padding:14px 8px 6px"><div class="chart-title">Dribbling Points by Week</div><canvas id="chartPoints" height="180"></canvas></div>`;
  }
  if (d.drillStats.length > 0) {
    html += `<div class="card flush">
      <div class="chart-title" style="padding:0 0 10px">Dribbling by Drill</div>
      ${d.drillStats.map((drill) => `
        <div class="trend-row">
          <span class="trend-label">${esc(drill.drillName)}</span>
          <span style="text-align:right">
            <span class="trend-value">${drill.points} pts</span>
            <span style="font-size:11px;color:var(--gray);display:block;margin-top:1px">${drill.reps} reps · ${drill.sessions} ${drill.sessions === 1 ? "session" : "sessions"}</span>
          </span>
        </div>`).join("")}
    </div>`;
  }

  const calBase = new Date();
  const calDate = new Date(calBase.getFullYear(), calBase.getMonth() + state.calOffset, 1);
  const calYear = calDate.getFullYear(), calMonth = calDate.getMonth();
  const calCells = getMonthMatrix(calYear, calMonth);
  const calLabel = calDate.toLocaleDateString("en-US", { month: "long", year: "numeric" });
  html += `<div class="card" style="padding:14px 8px 6px">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:0 6px 10px">
      <button class="cal-nav-btn" onclick="calPrev()">‹</button>
      <div style="font-size:13px;font-weight:700;color:var(--ink)">${calLabel}</div>
      <button class="cal-nav-btn" ${state.calOffset >= 0 ? "disabled style='opacity:0.3'" : ""} onclick="calNext()">›</button>
    </div>
    <div class="cal-grid" style="padding:0 6px 10px">
      ${["S","M","T","W","T","F","S"].map((x) => `<div class="cal-dow">${x}</div>`).join("")}
      ${calCells.map((cell) => {
        if (!cell) return `<div></div>`;
        const practiced = d.practicedDates.has(cell);
        const isToday = cell === todayStr();
        const dayNum = Number(cell.slice(-2));
        // A practised day is the only cell that leads anywhere, so only it
        // becomes a button — the rest stay plain text and unfocusable.
        const inner = practiced
          ? `<button class="cal-day practiced ${isToday ? "today" : ""}" onclick="jumpToSession('${cell}')" title="Go to this session" aria-label="Go to the session on ${fmtShort(cell)}">${dayNum}</button>`
          : `<div class="cal-day ${isToday ? "today" : ""}">${dayNum}</div>`;
        return `<div class="cal-cell">${inner}</div>`;
      }).join("")}
    </div>
  </div>`;

  html += `<div class="section-label">Session Log</div>`;
  const sortedDesc = [...state.sessions].sort((a, b) => b.date.localeCompare(a.date));
  for (const s of sortedDesc) {
    const title = esc(s.type === "shooting" ? s.label : s.drillName);
    const sub = s.type === "shooting"
      ? `${s.makes}/${s.attempts} (${s.attempts > 0 ? Math.round((s.makes / s.attempts) * 100) : 0}%)${s.swishes != null && s.attempts > 0 ? ` · ${Math.round((s.swishes / s.attempts) * 1000) / 10}% swish` : ""}`
      : `${s.points} pts · ${s.reps} reps`;
    let mechLine = "";
    if (s.type === "shooting") {
      const suspect = new Set(d.suspectMechanics);
      const bits = [];
      const add = (label, value, metric) => {
        if (value === null || value === undefined) return;
        const shaky = metric && suspect.has(metric);
        bits.push(`<span class="mech-bit${shaky ? " shaky" : ""}"${shaky ? ' title="This reading looks like a capture problem — see Shot Mechanics"' : ""}>${label} ${value}${shaky ? " ?" : ""}</span>`);
      };
      add("spin", s.spinRate === null ? null : s.spinRate + "%", "Spin rate");
      add("release", s.releaseTime === null ? null : s.releaseTime + "%", "Release time");
      add("arc", s.shotArc === null ? null : s.shotArc + "%", "Shot arc");
      add("intensity", s.intensity === null ? null : s.intensity + "%", "Intensity");
      if (s.duration != null) bits.push(`<span class="mech-bit">${s.duration} min</span>`);
      if (s.shotForm) bits.push(`<span class="mech-bit">${esc(s.shotForm.toLowerCase())}</span>`);
      if (bits.length) mechLine = `<div class="mech-line">${bits.join("")}</div>`;
    }
    html += `<div class="session-row" id="session-${s.id}">
      <div><div class="session-title">${title}</div><div class="session-sub">${fmtShort(s.date)}${s.time ? ` · ${fmtTime(s.time)}` : ""} · ${sub}</div>${mechLine}${
        s.notes ? `<div style="font-size:12px;color:var(--ink-2);margin-top:5px;line-height:1.4">${esc(s.notes)}</div>` : ""
      }</div>
      <span style="display:flex;gap:2px;flex-shrink:0">
      ${s.type === "shooting" && ((s.closeAttempts || 0) + (s.midAttempts || 0)) > 0
        ? `<button class="del-btn" onclick="swapSessionZones('${s.id}')" title="Swap this session's Close and Mid" aria-label="Swap Close and Mid for this session">⇅</button>` : ""}
      <button class="del-btn" onclick="startEdit('${s.id}')" aria-label="Edit session"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
      <button class="del-btn" onclick="handleDelete('${s.id}')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></button>
      </span>
    </div>`;
  }

  html += renderProfileCard();
  html += renderSyncCard();

  html += `<div style="text-align:center;margin-top:18px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap">
    <button class="btn-link" onclick="printRecap()">Print/share recap</button>
    <button class="btn-link" onclick="exportCsv()">Export CSV</button>
    <button class="btn-link" onclick="exportData()">Export data (JSON)</button>
    <button class="btn-link" onclick="triggerImport()">Import data (JSON)</button>
    <button class="btn-link" onclick="clearAll()">Clear all data</button>
    <button class="btn-link" onclick="setPin()">${getPin() ? "Change/remove PIN" : "Set a PIN"}</button>
  </div>`;

  html += `</div>`;
  return html;
}

function trendRow(label, displayValue, current, previous, unit) {
  let deltaHtml = `<span class="trend-delta flat">—</span>`;
  if (current !== null && previous !== null) {
    const diff = Math.round((current - previous) * 10) / 10;
    if (diff > 0) deltaHtml = `<span class="trend-delta up">▲ ${diff}${unit}</span>`;
    else if (diff < 0) deltaHtml = `<span class="trend-delta down">▼ ${Math.abs(diff)}${unit}</span>`;
    else deltaHtml = `<span class="trend-delta flat">— 0${unit}</span>`;
  }
  return `<div class="trend-row">
    <span class="trend-label">${label}</span>
    <span><span class="trend-value">${displayValue}</span>${deltaHtml}</span>
  </div>`;
}

const MONTH_MAP = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };
const KNOWN_DRILLS = ["Tight Handles", "Two-Ball Series", "Cone Weave", "Live Ball Combo"];

function flattenOcrText(text) {
  return text.replace(/\s+/g, " ").trim();
}

// Parses the "Shots by distance" popup: three stacked bars labelled
// Close-range / Mid-range / Long-range, each with an "N shots" total and
// Swish% / Make% bands. Note: in DribbleUp's model the Make band EXCLUDES
// swishes, so makes and swishes are stored as separate counts.
function parseZoneScreenshot(flat, targetMakes) {
  // What OCR reliably gives us from the "Shots by distance" popup:
  //   - the "N shots" bar totals, in some order
  //   - the make% figures, in THE SAME order as those totals
  // What it cannot give us: which bar is Close vs Mid. That's an x-position
  // fact, and flattening to text discards x-position. The vertical offset
  // between the two captions is tiny (~26px), so the read order even flips
  // between runs on the identical image. We therefore pair totals to
  // percentages positionally (reliable), assign the smallest bar to
  // Long-range (safe — it's visually isolated), and leave Close vs Mid as a
  // flagged guess the user can flip with one tap.
  const out = {};
  const popupIdx = flat.search(/Shots?\s+by\s+distance/i);
  if (popupIdx < 0) return out;
  // Stop before the coaching tip / badges, which contain unrelated numbers.
  const tailIdx = flat.slice(popupIdx).search(/Increase your|Watch this|Badges|Backboard/i);
  const popup = tailIdx > 0 ? flat.slice(popupIdx, popupIdx + tailIdx) : flat.slice(popupIdx);

  const totals = [...popup.matchAll(/(\d+)\s*shots?\b/gi)].map((m) => Number(m[1]));
  const pcts = [...popup.matchAll(/(\d{1,3})\s*%/g)].map((m) => Number(m[1]));
  if (totals.length === 0) return out;

  // Bars big enough to render bands carry a make% (and sometimes a swish%).
  // Take the first N percentages as the make% list, matched positionally.
  const banded = totals.filter((n) => n > 1).length || totals.length;
  const makePcts = pcts.slice(0, Math.min(banded, pcts.length));
  const swishPcts = pcts.length >= makePcts.length * 2 ? pcts.slice(makePcts.length, makePcts.length * 2) : [];

  // The totals list and the percentage list are each internally ordered, but
  // OCR sometimes reads totals tallest-first while reading percentages
  // left-to-right — so the two lists can disagree on direction, and it flips
  // between runs on the same image. Build both candidate pairings and, when we
  // know the session's MAKES total, keep whichever reproduces it.
  const buildBars = (pctList) => totals.map((n, i) => ({
    attempts: n,
    makePct: pctList[i] !== undefined ? pctList[i] : null,
    swishPct: swishPcts[i] !== undefined ? swishPcts[i] : null,
  }));
  const impliedFor = (barList) => barList.reduce((a, b) => a + (b.makePct !== null ? Math.round((b.attempts * b.makePct) / 100) : 0), 0);

  // The popup overlays the main stats screen, so its MAKES figure is usually
  // still visible in the same capture — use it if the caller didn't supply one.
  if (!targetMakes) {
    const selfMakes = flat.match(/MAKES\s*%?\s*(\d+)/i);
    if (selfMakes) targetMakes = selfMakes[1];
  }

  let bars = buildBars(makePcts);
  if (targetMakes) {
    const reversedPcts = [...makePcts].reverse();
    const alt = buildBars(reversedPcts);
    const diffA = Math.abs(impliedFor(bars) - Number(targetMakes));
    const diffB = Math.abs(impliedFor(alt) - Number(targetMakes));
    if (diffB < diffA) {
      bars = alt;
      swishPcts.reverse();
      bars = buildBars(reversedPcts);
    }
  }

  // Smallest bar is Long-range; the remaining two are Close and Mid in an
  // order we can't determine from text.
  const sorted = [...bars].sort((a, b) => a.attempts - b.attempts);
  const longBar = sorted[0];
  const bigBars = sorted.slice(1);

  const assign = (zone, bar) => {
    if (!bar) return;
    out[zone + "Attempts"] = String(bar.attempts);
    if (bar.makePct !== null) out[zone + "Makes"] = String(Math.round((bar.attempts * bar.makePct) / 100));
    if (bar.swishPct !== null) out[zone + "Swishes"] = String(Math.round((bar.attempts * bar.swishPct) / 100));
  };

  if (bars.length >= 3) {
    assign("long", longBar);
    // Guess: DribbleUp draws Close, Mid, Long left-to-right, and mid-range
    // volume usually exceeds close-range in these sessions — but this is the
    // ambiguous part, flagged below so the user can flip it.
    assign("close", bigBars[0]);
    assign("mid", bigBars[1]);
    if (bigBars.length === 2 && bigBars[0].attempts !== bigBars[1].attempts) out._zoneGuess = true;
  } else if (bars.length === 2) {
    assign("close", bigBars[0] || sorted[0]);
    assign("mid", bigBars[1] || sorted[1]);
    out._zoneGuess = true;
  } else {
    assign("close", bars[0]);
  }

  const totalAttempts = totals.reduce((a, n) => a + n, 0);
  if (totalAttempts > 0) out._zoneTotalAttempts = String(totalAttempts);
  // Total makes implied by the pairing — lets the caller sanity-check against
  // the MAKES figure from the main screen.
  const impliedMakes = bars.reduce((a, b) => a + (b.makePct !== null ? Math.round((b.attempts * b.makePct) / 100) : 0), 0);
  if (impliedMakes > 0) out._impliedMakes = impliedMakes;
  return out;
}

function detectScreenshotType(flat) {
  // The zone popup is distinctive: range labels plus the Swish/Make/Miss legend.
  const zoneHits = /Close-?range/i.test(flat) && /Mid-?range/i.test(flat) && /Long-?range/i.test(flat);
  const hasLegend = /\bSwish\b/i.test(flat) && /\bMake\b/i.test(flat) && /\bMiss\b/i.test(flat);
  const byDistance = /Shots?\s+by\s+distance/i.test(flat);
  if (byDistance || (zoneHits && hasLegend)) return "zones";

  const hasShootingWords = /ATTEMPTS/i.test(flat) && /MAKES/i.test(flat);
  const hasDribbleWords = /\bpts\b/i.test(flat) && /\breps\b/i.test(flat);
  if (hasShootingWords) return "shooting";
  if (hasDribbleWords) return "dribbling";
  return null;
}

function numAfter(flat, label) {
  const re = new RegExp(label + "\\D{0,12}?(\\d+(?:\\.\\d+)?)", "i");
  const m = flat.match(re);
  return m ? m[1] : null;
}

function parseShootScreenshot(flat) {
  const out = {};
  // Tracks which fields were calculated rather than read directly off the
  // image, so the UI can show the user how much to trust each value.
  const derived = new Set();

  // OCR on this screen is unreliable for the big stylized numbers in the stats
  // block — they're frequently dropped entirely, and labels often get read as a
  // group separate from their values (e.g. "SPIN RATE RELEASE TIME SHOT ARC"
  // followed by "8% 0% 40%"). So we lean on the most consistently-read sources
  // and cross-derive the rest.

  // 1. Attempts: the coaching tip states it in plain prose ("You took 250
  //    shots"), which OCR reads far more reliably than the stats block.
  const tipM = flat.match(/took\s+(\d+)\s*&?\s*shots?/i);
  out.attempts = tipM ? tipM[1] : null;

  // 2. Overall shooting % from the circle ("SHOOTING 45%" — the % is sometimes
  //    misread as a stray "o").
  const pctM = flat.match(/SHOOTING\s+(\d{1,3})\s*(?:%|o\b|\bo\s)/i);
  const shootingPct = pctM ? Number(pctM[1]) : null;

  // 3. Makes: try to read it directly, tolerating junk between label and value.
  const makesM = flat.match(/MAKES\s*%?\s*(\d+)/i);
  out.makes = makesM ? makesM[1] : null;

  // Fall back to the ATTEMPTS block only if the tip didn't give us attempts.
  if (out.attempts === null) {
    const attemptsIdx = flat.search(/ATTEMPTS/i);
    if (attemptsIdx !== -1) {
      const stopMatch = flat.slice(attemptsIdx).match(/SPIN RATE|RELEASE TIME|SHOT ARC|SHOT FORM|SHOT TYPE|DURATION|TIME ACTIVE|INTENSITY/i);
      const block = stopMatch ? flat.slice(attemptsIdx, attemptsIdx + stopMatch.index) : flat.slice(attemptsIdx);
      const counts = [...block.replace(/\d+\s*%/g, " ").matchAll(/\d+/g)].map((m) => m[0]);
      if (counts[0] !== undefined) out.attempts = counts[0];
      if (out.makes === null && counts[1] !== undefined) out.makes = counts[1];
      if (counts[2] !== undefined) out.swishes = counts[2];
    }
  }

  // 4. Derive/validate makes against the shooting percentage.
  if (out.attempts !== null && shootingPct !== null) {
    const expected = Math.round((Number(out.attempts) * shootingPct) / 100);
    const makesNum = out.makes !== null ? Number(out.makes) : null;
    if (makesNum === null || makesNum > Number(out.attempts) || Math.abs(makesNum - expected) > Math.max(5, expected * 0.2)) {
      out.makes = String(expected);
      out._recovered = true;
      derived.add("makes");
    }
  }

  // 5. Swishes: derive from the "Swishes NN%" line if not already read.
  if ((out.swishes === null || out.swishes === undefined) && out.attempts !== null) {
    const swishPctM = flat.match(/Swishes\s+(\d{1,3})\s*%/i);
    if (swishPctM) {
      out.swishes = String(Math.round((Number(out.attempts) * Number(swishPctM[1])) / 100));
      out._recovered = true;
      derived.add("swishes");
    }
  }
  if (out.swishes === undefined) out.swishes = null;

  // 6. Makes can never exceed attempts.
  if (out.attempts !== null && out.makes !== null && Number(out.makes) > Number(out.attempts)) {
    const tmp = out.attempts;
    out.attempts = out.makes;
    out.makes = tmp;
    out._swapped = true;
  }

  // 7. Three-up metric row: labels are often grouped, then values grouped.
  const tripleM = flat.match(/SPIN RATE\s+RELEASE TIME\s+SHOT ARC\s+(\d+)\s*%\s+(\d+)\s*%\s+(\d+)\s*%/i);
  if (tripleM) {
    out.spinRate = tripleM[1];
    out.releaseTime = tripleM[2];
    out.shotArc = tripleM[3];
  } else {
    const s = flat.match(/SPIN RATE\D{0,10}?(\d+)\s*%/i); out.spinRate = s ? s[1] : null;
    const r = flat.match(/RELEASE TIME\D{0,10}?(\d+)\s*%/i); out.releaseTime = r ? r[1] : null;
    const a = flat.match(/SHOT ARC\D{0,10}?(\d+)\s*%/i); out.shotArc = a ? a[1] : null;
  }

  // 8. Duration + intensity, also often grouped ("TIME ACTIVE INTENSITY 39 min 82%").
  const diM = flat.match(/(?:TIME ACTIVE|DURATION)\s+INTENSITY\s+(\d+)\s*min\s+(\d+)/i);
  if (diM) {
    out.duration = diM[1];
    out.intensity = diM[2];
  } else {
    const d = flat.match(/(?:TIME ACTIVE|DURATION)\D{0,10}?(\d+)\s*min/i); out.duration = d ? d[1] : null;
    const i = flat.match(/INTENSITY\D{0,10}?(\d+)\s*%/i); out.intensity = i ? i[1] : null;
  }

  const formM = flat.match(/\b(Inconsistent|Consistent)\b/i); out.shotForm = formM ? formM[1] : null;
  const typeM = flat.match(/(\d+)\s*%\s*relaxed/i); out.shotType = typeM ? `${typeM[1]}% relaxed` : null;
  out.label = "Shootaround";
  out._derived = Array.from(derived);
  return out;
}

function parseDribbleScreenshot(flat) {
  const out = {};
  let drillName = null;
  for (const d of KNOWN_DRILLS) {
    if (flat.toLowerCase().includes(d.toLowerCase())) { drillName = d; break; }
  }
  if (!drillName) {
    const m = flat.match(/([A-Za-z][A-Za-z '\-]{2,30}?)\s+Basketball\b/i);
    if (m) drillName = m[1].trim();
  }
  out.drillName = drillName;
  const ptsM = flat.match(/(\d+)\s*pts/i); out.points = ptsM ? ptsM[1] : null;
  const repsM = flat.match(/(\d+)\s*reps/i); out.reps = repsM ? repsM[1] : null;
  const dtM = flat.match(/(\w{3}),?\s*(\w{3})\s+(\d{1,2}),\s*(\d{4})\s*(?:at)?\s*(\d{1,2}):(\d{2})\s*([AP]M)/i);
  if (dtM) {
    const monthIdx = MONTH_MAP[dtM[2].toLowerCase().slice(0, 3)];
    if (monthIdx !== undefined) {
      const year = dtM[4], day = dtM[3].padStart(2, "0"), month = String(monthIdx + 1).padStart(2, "0");
      let hour = parseInt(dtM[5], 10);
      const minute = dtM[6];
      const ampm = dtM[7].toUpperCase();
      if (ampm === "PM" && hour !== 12) hour += 12;
      if (ampm === "AM" && hour === 12) hour = 0;
      out.date = `${year}-${month}-${day}`;
      out.time = `${String(hour).padStart(2, "0")}:${minute}`;
    }
  }
  return out;
}

// Returns the CSS class marking whether a field was read directly from the
// screenshot, calculated from other values, or left alone.
function ocrClass(s, key) {
  if (s._ocrDerived && s._ocrDerived.includes(key)) return " ocr-derived";
  if (s._ocrFilled && s._ocrFilled.includes(key)) return " ocr-read";
  return "";
}
function ocrTag(s, key) {
  if (s._ocrDerived && s._ocrDerived.includes(key)) return `<span class="field-tag derived">calc'd</span>`;
  if (s._ocrFilled && s._ocrFilled.includes(key)) return `<span class="field-tag read">scanned</span>`;
  return "";
}

function fieldHtml(label, inputHtml, required) {
  return `<div class="field"><label>${label}${required ? " *" : ""}</label>${inputHtml}</div>`;
}

function renderLogForm() {
  const s = state.shooting, dr = state.dribbling;
  let html = `<div style="padding:0 20px">`;

  if (state.editingId) {
    html += `<div style="background:rgba(95,208,165,0.10);border:1px solid var(--green);border-radius:10px;padding:11px 13px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:10px">
      <span style="font-size:12.5px;color:var(--green)">Editing an existing session</span>
      <button class="btn-ghost" style="padding:6px 12px;font-size:11.5px" onclick="cancelEdit()">Cancel</button>
    </div>`;
  }

  html += `<div class="import-card">
    <input type="file" id="f-screenshot" accept="image/*" multiple style="display:none" onchange="handleScreenshotImport(this)" ${state.ocrBusy ? "disabled" : ""} />
    <button class="btn-primary" style="width:100%" ${state.ocrBusy ? "disabled" : ""} onclick="document.getElementById('f-screenshot').click()">${state.ocrBusy ? `<span class="spin"></span>Reading…` : "Import from screenshot"}</button>
    <div class="import-status">${state.ocrBusy ? `<span class="spin"></span>${state.ocrStatus}` : (visionAvailable === true ? "✨ AI vision reading — most accurate. Pick one or both screens." : "Pick one or both DribbleUp screens at once — stats and &quot;Shots by distance&quot;")}</div>
    ${state.lastOcrRaw ? `
      <button class="btn-link" style="margin-top:10px" onclick="toggleOcrDebug()">${state.showOcrDebug ? "Hide" : "Show"} raw OCR text (debug)</button>
      ${state.showOcrDebug ? `
        <div style="margin-top:10px;text-align:left">
          <textarea readonly id="f-ocr-raw" style="width:100%;height:150px;background:var(--surface);border:1px solid var(--navy-line);border-radius:8px;color:var(--ink-2);font-family:monospace;font-size:11px;padding:8px;line-height:1.4">${state.lastOcrRaw.replace(/</g, "&lt;")}</textarea>
          <button class="btn-ghost" style="margin-top:8px;width:100%;padding:8px" onclick="copyOcrRaw()">Copy raw text</button>
        </div>` : ""}
    ` : ""}
  </div>`;

  html += `<div class="row" style="margin-bottom:18px">
    <button class="seg-btn ${state.type === "shooting" ? "active" : ""}" onclick="setType('shooting')">Shooting</button>
    <button class="seg-btn ${state.type === "dribbling" ? "active" : ""}" onclick="setType('dribbling')">Dribbling</button>
  </div>`;

  html += `<div class="row">
    ${fieldHtml("Date", `<input class="input" id="f-date" type="date" value="${state.date}" max="${todayStr()}" oninput="updateDate(this.value)" />`)}
    ${fieldHtml("Time", `<input class="input" id="f-time" type="time" value="${state.time}" oninput="updateTime(this.value)" />`)}
  </div>`;

  if (state.type === "shooting") {
    html += fieldHtml("Session name", `<input class="input" id="f-shooting-label" type="text" value="${s.label}" placeholder="Shootaround" oninput="updateShooting('label', this.value)" />`);
    if ((s._ocrFilled && s._ocrFilled.length) || (s._ocrDerived && s._ocrDerived.length)) {
      html += `<div class="ocr-legend">
        <span><span class="legend-dot" style="background:var(--green)"></span>Scanned — read directly off the screenshot</span>
        <span><span class="legend-dot" style="background:#d9a441"></span>Calc'd — worked out from other numbers, double-check</span>
        <span><span class="legend-dot" style="background:var(--navy-line)"></span>Unmarked — not found, enter manually</span>
      </div>`;
    }
    if (s._ocrLowConfidence || s._ocrSwapped) {
      html += `<div style="background:rgba(244,123,32,0.12);border:1px solid var(--orange);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:12.5px;color:var(--ink);line-height:1.5">
        ⚠️ ${s._ocrSwapped ? "Attempts/Makes looked swapped and were auto-corrected." : "Couldn't clearly read all 3 numbers (Attempts/Makes/Swishes) from the screenshot."} Please check these against the actual screenshot before saving.
      </div>`;
    }
    html += `<div class="row">
      ${fieldHtml("Attempts" + ocrTag(s, "attempts"), `<input class="input${ocrClass(s, "attempts")}" id="f-shooting-attempts" type="number" min="0" value="${s.attempts}" oninput="updateShooting('attempts', this.value)" />`, true)}
      ${fieldHtml("Makes" + ocrTag(s, "makes"), `<input class="input${ocrClass(s, "makes")}" id="f-shooting-makes" type="number" min="0" value="${s.makes}" oninput="updateShooting('makes', this.value)" />`, true)}
    </div>`;
    const swishPct = (s.swishes !== "" && s.attempts !== "" && Number(s.attempts) > 0)
      ? `<div style="font-size:11px;color:var(--orange);margin-top:4px">≈ ${Math.round((Number(s.swishes) / Number(s.attempts)) * 1000) / 10}% of attempts</div>` : "";
    html += `<div class="row">
      ${fieldHtml("Swishes" + ocrTag(s, "swishes"), `<input class="input${ocrClass(s, "swishes")}" id="f-shooting-swishes" type="number" min="0" value="${s.swishes}" oninput="updateShooting('swishes', this.value)" />${swishPct}`)}
      ${fieldHtml("Duration (min)" + ocrTag(s, "duration"), `<input class="input${ocrClass(s, "duration")}" id="f-shooting-duration" type="number" min="0" value="${s.duration}" oninput="updateShooting('duration', this.value)" />`)}
    </div>`;
    html += `<div class="field">
      <label style="font-size:17px;font-weight:800;letter-spacing:-0.02em;color:var(--ink);margin-bottom:2px">Shots by distance ${ocrTag(s, "closeAttempts")}</label>
      <div style="font-size:12px;color:var(--ink-2);margin:0 0 10px;line-height:1.45">Attempts / makes / swishes per zone. Import the "Shots by distance" popup to fill automatically.</div>
      ${s._zoneGuess ? `<div style="background:rgba(244,123,32,0.12);border:1px solid var(--orange);border-radius:9px;padding:9px 11px;margin-bottom:10px;font-size:11.5px;color:var(--ink);line-height:1.45">
        ⚠️ Close vs Mid can't be told apart from the screenshot text — check them against the popup.
        <button type="button" onclick="swapCloseMid()" style="display:block;margin-top:7px;background:var(--orange);color:var(--navy);border:none;border-radius:7px;padding:6px 12px;font-weight:700;font-size:11.5px;cursor:pointer">⇅ Swap Close / Mid</button>
      </div>` : ""}
      ${s._zoneMakesCheck === "ok" ? `<div style="font-size:11px;color:var(--green);margin-bottom:9px">✓ Zone makes add up to the session total — pairing looks right.</div>` : ""}
      ${s._zoneMakesCheck === "mismatch" ? `<div style="font-size:11px;color:var(--red);margin-bottom:9px">⚠️ Zone makes don't match the session total — please verify.</div>` : ""}
      ${["close", "mid", "long"].map((z) => {
        const name = z === "close" ? "Close" : z === "mid" ? "Mid" : "Long";
        return `<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
          <span style="font-size:11.5px;color:var(--gray);width:42px;flex-shrink:0">${name}</span>
          <input class="input${ocrClass(s, z + "Attempts")}" id="f-shooting-${z}Attempts" type="number" min="0" placeholder="att" value="${s[z + "Attempts"] || ""}" oninput="updateShooting('${z}Attempts', this.value)" style="margin-top:0" />
          <input class="input${ocrClass(s, z + "Makes")}" id="f-shooting-${z}Makes" type="number" min="0" placeholder="make" value="${s[z + "Makes"] || ""}" oninput="updateShooting('${z}Makes', this.value)" style="margin-top:0" />
          <input class="input${ocrClass(s, z + "Swishes")}" id="f-shooting-${z}Swishes" type="number" min="0" placeholder="swish" value="${s[z + "Swishes"] || ""}" oninput="updateShooting('${z}Swishes', this.value)" style="margin-top:0" />
        </div>`;
      }).join("")}
    </div>`;
    html += `<div style="font-size:17px;font-weight:800;letter-spacing:-0.02em;color:var(--ink);margin:20px 0 10px">Shot mechanics</div>`;
    html += `<div class="row">
      ${fieldHtml("Spin rate (%)" + ocrTag(s, "spinRate"), `<input class="input${ocrClass(s, "spinRate")}" id="f-shooting-spinRate" type="number" min="0" max="100" value="${s.spinRate}" oninput="updateShooting('spinRate', this.value)" />`)}
      ${fieldHtml("Release time (%)" + ocrTag(s, "releaseTime"), `<input class="input${ocrClass(s, "releaseTime")}" id="f-shooting-releaseTime" type="number" min="0" max="100" value="${s.releaseTime}" oninput="updateShooting('releaseTime', this.value)" />`)}
    </div>`;
    html += `<div class="row">
      ${fieldHtml("Shot arc (%)" + ocrTag(s, "shotArc"), `<input class="input${ocrClass(s, "shotArc")}" id="f-shooting-shotArc" type="number" min="0" max="100" value="${s.shotArc}" oninput="updateShooting('shotArc', this.value)" />`)}
      ${fieldHtml("Intensity (%)" + ocrTag(s, "intensity"), `<input class="input${ocrClass(s, "intensity")}" id="f-shooting-intensity" type="number" min="0" max="100" value="${s.intensity}" oninput="updateShooting('intensity', this.value)" />`)}
    </div>`;
    if (Array.isArray(s.badges) && s.badges.length) {
      html += `<div class="field">
        <label>Badges captured <span class="field-tag read">scanned</span></label>
        <div style="margin-top:4px">${s.badges.map((b) => `<span class="badge-chip">${b.grade ? `<span class="badge-grade">${esc(b.grade)}</span>` : ""}${esc(b.name)}${b.zone ? `<span class="badge-zone">${b.zone}</span>` : ""}</span>`).join("")}</div>
        <button type="button" class="btn-link" style="margin-top:4px" onclick="updateShooting('badges', [])">Clear badges</button>
      </div>`;
    }
    html += fieldHtml("Shot form" + ocrTag(s, "shotForm"), `<input class="input${ocrClass(s, "shotForm")}" id="f-shooting-shotForm" type="text" value="${s.shotForm}" placeholder="Consistent / Inconsistent" oninput="updateShooting('shotForm', this.value)" />`);
  } else {
    html += fieldHtml("Drill name", `<input class="input" id="f-dribbling-drillName" type="text" value="${dr.drillName}" placeholder="Tight Handles" oninput="updateDribbling('drillName', this.value)" />`);
    html += `<div class="row">
      ${fieldHtml("Points", `<input class="input" id="f-dribbling-points" type="number" min="0" value="${dr.points}" oninput="updateDribbling('points', this.value)" />`, true)}
      ${fieldHtml("Reps", `<input class="input" id="f-dribbling-reps" type="number" min="0" value="${dr.reps}" oninput="updateDribbling('reps', this.value)" />`, true)}
    </div>`;
    html += fieldHtml("Duration (min)", `<input class="input" id="f-dribbling-duration" type="number" min="0" value="${dr.duration}" oninput="updateDribbling('duration', this.value)" />`);
  }

  html += fieldHtml("Notes (optional)", `<textarea class="input" id="f-notes" rows="2" style="resize:vertical;line-height:1.45" placeholder="Anything the numbers miss — outdoor, tired, first session back, new drill." oninput="updateNotes(this.value)">${esc(state.notes)}</textarea>`);

  if (state.error) html += `<div style="color:var(--red);font-size:12.5px;margin-bottom:10px">${state.error}</div>`;
  html += `<button class="btn-primary" style="width:100%;margin-top:6px" onclick="handleAdd()">${state.editingId ? "Save Changes" : "Log Session"}</button>`;
  html += `</div>`;
  return html;
}

/* ---------- charts ---------- */
function drawCharts() {
  if (typeof Chart === "undefined") return; // offline with a cold cache

  const d = computeDerived();
  const gray = "#6b6b6b", navyLine = "#e4e4e4", orange = "#f47b20", navyLightBar = "#d8d8d8";
  Chart.defaults.font.family = "'Inter', sans-serif";

  if (document.getElementById("chartFg")) {
    destroyChart("fg");
    charts.fg = new Chart(document.getElementById("chartFg"), {
      type: "line",
      data: { labels: d.weekly.map((w) => w.label), datasets: [{ label: "FG%", data: d.weekly.map((w) => w.shootingPct), borderColor: orange, backgroundColor: orange, tension: 0.35, spanGaps: true, pointRadius: 3 }] },
      options: { responsive: true, plugins: { legend: { display: false } }, scales: {
        x: { ticks: { color: gray, font: { size: 10 } }, grid: { color: navyLine } },
        y: { min: 0, max: 100, ticks: { color: gray, font: { size: 10 } }, grid: { color: navyLine } }
      } }
    });
  }
  // Sessions are discrete workouts at irregular intervals, so bars: a line
  // would draw a slope between two dates that has no reading in between.
  // The clock only disambiguates when two sessions share a day; otherwise it
  // is noise on every tick.
  const dupDates = new Set();
  const seenDates = new Set();
  for (const s of d.bySession) { if (seenDates.has(s.date)) dupDates.add(s.date); seenDates.add(s.date); }
  const sessionLabel = (s) => fmtShort(s.date) + (s.time && dupDates.has(s.date) ? " " + fmtTime(s.time) : "");
  // Pad the axis around the data instead of always spanning 0-100.
  const yFloor = (vals) => { const v = vals.filter((x) => x !== null); return v.length ? Math.max(0, Math.floor((Math.min(...v) - 10) / 10) * 10) : 0; };
  const yCeil = (vals) => { const v = vals.filter((x) => x !== null); return v.length ? Math.min(100, Math.ceil((Math.max(...v) + 10) / 10) * 10) : 100; };
  if (document.getElementById("chartFgSession")) {
    destroyChart("fgSession");
    charts.fgSession = new Chart(document.getElementById("chartFgSession"), {
      type: "bar",
      data: { labels: d.bySession.map(sessionLabel), datasets: [{ label: "FG%", data: d.bySession.map((s) => s.pct), backgroundColor: orange, borderRadius: 4 }] },
      options: { responsive: true, plugins: { legend: { display: false },
        tooltip: { callbacks: { label: (c) => { const s = d.bySession[c.dataIndex]; return `${s.makes}/${s.attempts} · ${s.pct}%`; } } } }, scales: {
        x: { ticks: { color: gray, font: { size: 9 }, maxRotation: 0, autoSkip: false }, grid: { display: false } },
        y: { min: yFloor(d.bySession.map((s) => s.pct)), max: yCeil(d.bySession.map((s) => s.pct)),
             ticks: { color: gray, font: { size: 10 }, maxTicksLimit: 5 }, grid: { color: navyLine } }
      } }
    });
  }
  if (document.getElementById("chartZoneSession")) {
    destroyChart("zoneSession");
    // Picked against the light card surface and checked with the palette
    // validator: in band, and separable under every simulated CVD type.
    const zoneSeries = [
      { key: "close", label: "Close", color: "#2f6fb5" },
      { key: "mid", label: "Mid", color: "#e06c0a" },
      { key: "long", label: "Long", color: "#1f7a52" },
    ].filter((z) => d.zoneStats.find((s) => s.zone === z.key && s.attempts >= 5));
    const zoneVals = zoneSeries.flatMap((z) => d.bySession.map((s) => s.zones[z.key].pct));
    charts.zoneSession = new Chart(document.getElementById("chartZoneSession"), {
      type: "line",
      data: { labels: d.bySession.map(sessionLabel), datasets: zoneSeries.map((z) => ({
        label: z.label, data: d.bySession.map((s) => s.zones[z.key].pct),
        borderColor: z.color, backgroundColor: z.color, borderWidth: 2,
        tension: 0.25, spanGaps: true, pointRadius: 4,
      })) },
      options: { responsive: true, plugins: { legend: { labels: { color: gray, font: { size: 11 } } },
        tooltip: { callbacks: { label: (c) => { const z = zoneSeries[c.datasetIndex].key, s = d.bySession[c.dataIndex];
          return `${zoneSeries[c.datasetIndex].label}: ${s.zones[z].makes}/${s.zones[z].attempts} · ${s.zones[z].pct}%`; } } } }, scales: {
        x: { ticks: { color: gray, font: { size: 9 }, maxRotation: 0, autoSkip: false }, grid: { display: false } },
        y: { min: yFloor(zoneVals), max: yCeil(zoneVals),
             ticks: { color: gray, font: { size: 10 }, maxTicksLimit: 5 }, grid: { color: navyLine } }
      } }
    });
  }
  if (document.getElementById("chartAttempts")) {
    destroyChart("attempts");
    charts.attempts = new Chart(document.getElementById("chartAttempts"), {
      type: "bar",
      data: { labels: d.weekly.map((w) => w.label), datasets: [
        { label: "Attempts", data: d.weekly.map((w) => w.attempts), backgroundColor: navyLightBar },
        { label: "Makes", data: d.weekly.map((w) => w.makes), backgroundColor: orange }
      ] },
      options: { responsive: true, plugins: { legend: { labels: { color: gray, font: { size: 11 } } } }, scales: {
        x: { ticks: { color: gray, font: { size: 10 } }, grid: { display: false } },
        y: { ticks: { color: gray, font: { size: 10 } }, grid: { color: navyLine } }
      } }
    });
  }
  if (document.getElementById("chartZones")) {
    destroyChart("zones");
    charts.zones = new Chart(document.getElementById("chartZones"), {
      type: "bar",
      data: { labels: d.weekly.map((w) => w.label), datasets: [
        { label: "Close", data: d.weekly.map((w) => w.close), backgroundColor: "#2f6fb5" },
        { label: "Mid", data: d.weekly.map((w) => w.mid), backgroundColor: orange },
        { label: "Long", data: d.weekly.map((w) => w.long), backgroundColor: "#1f7a52" }
      ] },
      options: { responsive: true, plugins: { legend: { labels: { color: gray, font: { size: 11 } } } }, scales: {
        x: { stacked: true, ticks: { color: gray, font: { size: 10 } }, grid: { display: false } },
        y: { stacked: true, ticks: { color: gray, font: { size: 10 } }, grid: { color: navyLine } }
      } }
    });
  }
  if (document.getElementById("chartPoints")) {
    destroyChart("points");
    charts.points = new Chart(document.getElementById("chartPoints"), {
      type: "bar",
      data: { labels: d.weekly.map((w) => w.label), datasets: [{ label: "Points", data: d.weekly.map((w) => w.points), backgroundColor: orange }] },
      options: { responsive: true, plugins: { legend: { display: false } }, scales: {
        x: { ticks: { color: gray, font: { size: 10 } }, grid: { display: false } },
        y: { ticks: { color: gray, font: { size: 10 } }, grid: { color: navyLine } }
      } }
    });
  }
}

/* ---------- init ---------- */
load();
render();
syncFromApi();
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
