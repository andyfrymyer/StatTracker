  :root {

    --bg: #ffffff;
    --surface: #f5f5f5;
    --surface-2: #ebebeb;
    --ink: #101010;
    --ink-2: #6b6b6b;
    --line: #e4e4e4;
    --orange: #f47b20;
    --green: #177a4d;   /* 4.9:1 on the card surface — the lighter green failed at 12px */
    --blue: #2f6fb5;
    --red: #c62f37;
    /* Legacy names, kept so existing rules and inline styles still resolve. */
    --navy: #ffffff;

    --navy-line: var(--line);
    --gray: var(--ink-2);

  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; background: var(--bg); color: var(--ink);

    overscroll-behavior-y: none;

  .h-iq { color: var(--orange); margin-left: 0.06em; }
  input, select, textarea { font-family: inherit; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--ink); outline-offset: 1px; }

  /* Hero — one number carries the screen, everything else sits under it.
     The whole block shares one condensed family so the eye reads a single

  .hero-sub { font-size: 13px; color: var(--ink-2); margin-top: 3px; min-height: 2.7em; }

  .hero-stat-l { font-size: 12.5px; color: var(--ink-2); margin-top: 5px; }

  .card { background: var(--surface); border: none; border-radius: 18px; padding: 18px; margin-bottom: 12px; }

  .card.flush { background: none; padding: 18px 2px 6px; border-top: 1px solid var(--line); border-radius: 0; margin-bottom: 4px; }
  .card.flush .chart-title { padding-left: 0; padding-right: 0; }

  .stat-value { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; color: var(--ink); }

  }

  .btn-ghost {

  /* Each reading wraps as a unit, so a line break can no longer strand a

  .del-btn { background:none; border:none; color: var(--ink-2); cursor:pointer; padding: 6px; font-size: 15px; line-height: 1; }
  /* Section headings are large and plain rather than small grey capitals. */
  .section-label { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; color: var(--ink);
    text-transform: none; margin: 26px 0 12px; }
  .zone-pill { flex:1; background: var(--surface); border: none; border-radius: 16px; padding: 12px 8px; text-align:center; }
  .zone-dot { width: 8px; height: 8px; border-radius: 50%; margin: 0 auto 6px; }
  .best-row { background: none; border: none; border-bottom: 1px solid var(--line); border-radius: 0; padding: 11px 2px; display:flex; justify-content:space-between; align-items:center; margin-bottom:0; }
  .best-row:last-child { border-bottom: none; }
  .best-label { font-size: 13.5px; color: var(--ink); font-weight: 700; }
  .best-sub { font-size: 12px; color: var(--ink-2); margin-top: 1px; }
  .best-value { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; color: var(--ink); }
  /* Floating pill nav, lifted off the bottom edge. */
  .tabbar { position: fixed; bottom: 0; left: 0; right: 0; padding: 0 16px 18px;
    background: linear-gradient(to top, var(--bg) 58%, rgba(255,255,255,0)); pointer-events: none; }
  .tabbar-inner { max-width: 420px; margin: 0 auto; display: flex; background: var(--bg);
    border-radius: 999px; padding: 6px; pointer-events: auto;
    box-shadow: 0 8px 28px rgba(0,0,0,0.16), 0 0 0 1px var(--line); }
  .tab-btn { flex: 1; background: none; border: none; padding: 10px 0; cursor: pointer; color: var(--ink-2);
    display:flex; flex-direction:column; align-items:center; gap:3px; border-radius: 999px; }
  .tab-btn.active { color: var(--ink); background: var(--surface); }
  /* Feedback on press, everywhere. Hover only where a pointer exists. */
  .btn-primary, .btn-ghost, .seg-btn, .btn-link, .del-btn, .tab-btn,
  .reminder-toggle, .cal-nav-btn, .hero-dot, .badge-chip {
    transition: background-color 0.12s ease, border-color 0.12s ease, color 0.12s ease,
                transform 0.06s ease, opacity 0.12s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-primary:active { background: #303030; transform: scale(0.985); }
  .btn-ghost:active, .seg-btn:not(.active):active, .cal-nav-btn:active { background: var(--surface); transform: scale(0.985); }
  .seg-btn.active:active { background: #303030; transform: scale(0.985); }
  .btn-link:active, .reminder-toggle:active { opacity: 0.55; }
  .del-btn:active { background: var(--surface-2); border-radius: 8px; }
  .tab-btn:active { transform: scale(0.97); }
  .hero-dot:active { transform: scale(1.35); }
  @media (hover: hover) {
    .btn-primary:hover { background: #262626; }
    .btn-ghost:hover, .cal-nav-btn:hover { background: var(--surface); border-color: var(--ink-2); }
    .seg-btn:not(.active):hover { border-color: var(--ink-2); color: var(--ink); }
    .btn-link:hover, .reminder-toggle:hover { color: var(--ink); }
    .del-btn:hover { color: var(--ink); background: var(--surface-2); border-radius: 8px; }
    .tab-btn:not(.active):hover { color: var(--ink); }
    .hero-dot:not(.active):hover { background: var(--ink-2); }
  }
  /* Keyboard users get the same affordance as pointer users. */
  .btn-primary:focus-visible, .btn-ghost:focus-visible, .seg-btn:focus-visible,
  .btn-link:focus-visible, .del-btn:focus-visible, .tab-btn:focus-visible,
  .reminder-toggle:focus-visible, .cal-nav-btn:focus-visible, .hero-dot:focus-visible {
    outline: 2px solid var(--ink); outline-offset: 2px;
  }
  @media (prefers-reduced-motion: reduce) {
    .btn-primary, .btn-ghost, .seg-btn, .btn-link, .del-btn, .tab-btn,
    .reminder-toggle, .cal-nav-btn, .hero-dot, .badge-chip { transition: none; }
    .btn-primary:active, .btn-ghost:active, .seg-btn:active, .tab-btn:active, .hero-dot:active { transform: none; }
  }
  .toast { position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; font-weight:700; font-size:13px; padding: 11px 20px; border-radius: 999px; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 50; max-width: 86vw; text-align:center; }
  .note-refresh { display: inline-flex; align-items: center; gap: 6px; font-family: inherit;
    font-size: 12px; font-weight: 700; padding: 7px 13px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); white-space: nowrap; }
  /* Filled once there are sessions the note has not read yet. */
  .note-refresh.due { background: var(--ink); border-color: var(--ink); color: #fff; }
  .note-refresh:disabled { opacity: 0.6; cursor: default; }
  .note-refresh.due .spin { border-color: rgba(255,255,255,0.35); border-top-color: #fff; }
  @media (hover: hover) {
    .note-refresh:not(:disabled):hover { border-color: var(--ink-2); }
    .note-refresh.due:not(:disabled):hover { background: #303030; }
  }
  .note-refresh:not(:disabled):active { transform: scale(0.97); }
  /* Stands in for the note while it is being written. */
  .skeleton-line { height: 12px; border-radius: 6px; margin-bottom: 9px;
    background: linear-gradient(90deg, var(--surface-2) 25%, #f0f0f0 50%, var(--surface-2) 75%);
    background-size: 220% 100%; animation: shimmer 1.4s linear infinite; }
  @keyframes shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }
  @media (prefers-reduced-motion: reduce) {
    .skeleton-line { animation: none; background: var(--surface-2); }

  .toast { display: flex; align-items: center; gap: 9px; }
  .toast.show { opacity: 1; }

  .toast.ok .toast-mark { background: var(--green); color: #fff; }

<body>
<div id="app"></div>
<div id="recap-print"></div>
<div id="toast" class="toast"></div>
<input type="file" id="importFile" accept="application/json" style="display:none" />

<script>
/* ---------- storage & helpers ---------- */
// Storage keys keep their original names deliberately — they are internal to
// the browser, and renaming them would strand each device's cached sessions,
// saved PIN, player context and coach note behind keys nothing reads.
const STORAGE_KEY = "ella-sessions-standalone";
const GOALS_KEY = "ella-goals-standalone";
const REMINDERS_KEY = "ella-reminders-standalone";
const LAST_NOTIFIED_KEY = "ella-last-notified-standalone";
const PIN_KEY = "ella-pin-standalone";
const API_BASE_KEY = "ella-api-base-standalone";
const API_PIN_KEY = "ella-api-pin-standalone";
const COACH_CACHE_KEY = "ella-coach-note-standalone";
const PROFILE_KEY = "ella-profile-standalone";
// Baked-in default so a fresh browser/device connects automatically without
// re-typing the URL. Safe to make public — it's not a secret, just an address.
// Leave as "" if you don't want a default (e.g. before you've deployed one).
const DEFAULT_API_BASE = "https://ella-tracker-api-production.up.railway.app";

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function esc(v) {
  return v === null || v === undefined ? "" : String(v)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
// Dates here are calendar days in the player's own timezone. toISOString()
// answers in UTC, so it reported tomorrow for an evening session in the
// Americas and yesterday for a morning one east of Greenwich — and that date
// then fed the streak, the week bucket and the weekly pace.
function localDateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function todayStr() { return localDateStr(new Date()); }
function addDays(dateStr, n) {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + n);
  return localDateStr(d);
}
function getMonday(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  return localDateStr(d);
}
function fmtShort(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
}
function fmtWeekLabel(mondayStr) {
  const d = new Date(mondayStr + "T00:00:00");
  return "Wk of " + d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
}
function fmtTime(t) {
  if (!t) return "";
  const [h, m] = t.split(":").map(Number);
  const period = h >= 12 ? "PM" : "AM";
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${h12}:${String(m).padStart(2, "0")} ${period}`;
}
function nowTimeStr() {
  const d = new Date();
  return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}
function isIOS() { return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream; }
function isStandalone() { return window.navigator.standalone === true || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches); }
function computeDayStreak(sessions) {
  const dateSet = new Set(sessions.map((s) => s.date));
  let cursor = todayStr();
  if (!dateSet.has(cursor)) {
    cursor = addDays(cursor, -1);
    if (!dateSet.has(cursor)) return 0;
  }
  let count = 0;
  while (dateSet.has(cursor)) { count++; cursor = addDays(cursor, -1); }
  return count;
}
function longestDayStreak(sessions) {
  const dates = Array.from(new Set(sessions.map((s) => s.date))).sort();
  let best = 0, cur = 0, prev = null;
  for (const d of dates) {
    cur = prev && addDays(prev, 1) === d ? cur + 1 : 1;
    if (cur > best) best = cur;
    prev = d;
  }
  return best;
}
function getMonthMatrix(year, month) {
  const firstDay = new Date(year, month, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) {
    cells.push(`${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`);
  }
  return cells;
}
// "tracks" says which activities she actually logs. A goal for something never
// logged used to hold onTrack permanently false, so the banner could never read
// on track and the daily reminder nagged for minutes she was not recording.
function computePace(thisWeek, goals, tracks) {
  const t = tracks || { shooting: true, dribbling: true };
  const monday = getMonday(todayStr());
  const daysElapsed = Math.floor((new Date(todayStr() + "T00:00:00") - new Date(monday + "T00:00:00")) / 86400000) + 1; // 1..7
  const expectedShots = t.shooting ? Math.round((goals.shots * daysElapsed) / 7) : 0;
  const expectedDribbleMin = t.dribbling ? Math.round((goals.dribbleMinutes * daysElapsed) / 7) : 0;
  const shotsBehind = Math.max(0, expectedShots - thisWeek.attempts);
  const dribbleBehind = Math.max(0, expectedDribbleMin - thisWeek.dribbleMin);
  const onTrack = shotsBehind === 0 && dribbleBehind === 0;
  return { daysElapsed, expectedShots, expectedDribbleMin, shotsBehind, dribbleBehind, onTrack };
}
function tracksOf(d) {
  return { shooting: d.shootingSessions.length > 0, dribbling: d.dribblingSessions.length > 0 };
}
function computeInsight(sessions, weekly, dayStreak) {
  const shootSessions = sessions.filter((s) => s.type === "shooting").sort((a, b) => a.date.localeCompare(b.date));
  let formStreak = 0;
  for (let i = shootSessions.length - 1; i >= 0; i--) {
    if ((shootSessions[i].shotForm || "").toLowerCase() === "inconsistent") formStreak++;
    else break;
  }
  if (formStreak >= 3) {
    return { tone: "warning", text: `Shot form logged inconsistent in ${formStreak} straight sessions. Worth dialing back volume and rebuilding a repeatable release before adding more reps.` };
  }
  const weeksWithPct = weekly.filter((w) => w.shootingPct !== null);
  if (weeksWithPct.length >= 3) {
    const last3 = weeksWithPct.slice(-3);
    if (last3[0].shootingPct > last3[1].shootingPct && last3[1].shootingPct > last3[2].shootingPct) {
      return { tone: "warning", text: `FG% has dropped 3 straight weeks (${last3[0].shootingPct}% → ${last3[2].shootingPct}%). Might be fatigue or volume — consider shorter, higher-quality sessions.` };
    }
    if (last3[0].shootingPct < last3[1].shootingPct && last3[1].shootingPct < last3[2].shootingPct) {
      return { tone: "positive", text: `FG% has climbed 3 straight weeks (${last3[0].shootingPct}% → ${last3[2].shootingPct}%). Whatever's happening in warmups is working — keep the reps consistent.` };
    }
  }
  if (dayStreak === 0 && sessions.length > 0) {
    return { tone: "neutral", text: "No session logged today or yesterday — get one in to keep the streak alive." };
  }
  if (dayStreak >= 5) {
    return { tone: "positive", text: `${dayStreak}-day practice streak. Consistency like this is what separates good shooters from great ones.` };
  }
  if (shootSessions.length > 0) {
    const last = shootSessions[shootSessions.length - 1];
    const pct = last.attempts > 0 ? Math.round((last.makes / last.attempts) * 100) : 0;
    return { tone: "neutral", text: `Last session: ${last.makes}/${last.attempts} (${pct}%). Keep stacking reps — trends need a few more sessions to show clearly.` };
  }
  return { tone: "neutral", text: "Log a few sessions and coaching tips will start showing up here." };
}
function buildDemoSessions() {
  const start = addDays(todayStr(), -27);
  const shootLabels = ["Shootaround", "Catch & Shoot", "Off the Dribble", "Free Throws + Mid"];
  const drillNames = ["Tight Handles", "Two-Ball Series", "Cone Weave", "Live Ball Combo"];
  const out = [];
  for (let week = 0; week < 4; week++) {
    const weekStart = addDays(start, week * 7);
    [0, 2, 4].forEach((offset, i) => {
      const attempts = 70 + week * 8 + Math.round(Math.random() * 15);
      const basePct = 0.34 + week * 0.03 + Math.random() * 0.05;
      const makes = Math.round(attempts * basePct);
      const closeMakes = Math.round(makes * 0.5);
      const midMakes = Math.round(makes * 0.32);
      const longMakes = Math.max(0, makes - closeMakes - midMakes);
      out.push({
        id: uid(), type: "shooting", date: addDays(weekStart, offset),
        time: `${16 + Math.round(Math.random() * 3)}:${String(Math.round(Math.random() * 59)).padStart(2, "0")}`,
        label: shootLabels[(week + i) % shootLabels.length],
        attempts, makes, closeMakes, midMakes, longMakes,
        swishes: Math.round(makes * (0.35 + Math.random() * 0.15)),
        spinRate: 8 + Math.round(Math.random() * 10),
        releaseTime: Math.round(Math.random() * 20),
        shotArc: 45 + Math.round(Math.random() * 25),
        shotForm: week < 2 ? "Inconsistent" : "Consistent",
        shotType: `${40 + Math.round(Math.random() * 20)}% relaxed`,
        duration: 20 + Math.round(Math.random() * 15),
        intensity: Math.round(Math.random() * 30),
      });
    });
    [1, 5].forEach((offset, i) => {
      const reps = 140 + week * 15 + Math.round(Math.random() * 20);
      const points = Math.round(reps * (4 + week * 0.3 + Math.random()));
      out.push({
        id: uid(), type: "dribbling", date: addDays(weekStart, offset),
        time: `${16 + Math.round(Math.random() * 3)}:${String(Math.round(Math.random() * 59)).padStart(2, "0")}`,
        drillName: drillNames[(week + i) % drillNames.length],
        points, reps, duration: 15 + Math.round(Math.random() * 10),
      });
    });
  }
  return out.sort((a, b) => a.date.localeCompare(b.date));
}

/* ---------- state ---------- */
let state = {
  sessions: [],
  goals: { shots: 500, dribbleMinutes: 30 },
  remindersEnabled: false,
  tab: "dashboard",
  type: "shooting",
  date: todayStr(),
  time: nowTimeStr(),
  shooting: emptyShooting(),
  dribbling: emptyDribbling(),
  calOffset: 0,
  error: "",
  ocrBusy: false,
  ocrStatus: "",
  lastOcrRaw: "",
  showOcrDebug: false,
  editingId: null,
  coachNote: null,      // { summary, progress, focus, plan, goals, dataGaps, generatedAt, sessionCount }
  coachLoading: false,
  profile: "",          // free-text context about the player, for the AI note
  notes: "",            // context for the session being logged right now
  apiBase: "",
  apiPin: "",
  syncStatus: "", // "", "syncing", "synced", "error", "offline"
};
function emptyShooting() {
  return { attempts: "", makes: "", swishes: "", spinRate: "", releaseTime: "", shotArc: "", shotForm: "", shotType: "", duration: "", intensity: "", label: "Shootaround",
    closeMakes: "", midMakes: "", longMakes: "",
    closeAttempts: "", midAttempts: "", longAttempts: "",
    closeSwishes: "", midSwishes: "", longSwishes: "", badges: [] };
}
function emptyDribbling() { return { drillName: "Tight Handles", points: "", reps: "", duration: "" }; }

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state.sessions = JSON.parse(raw);
  } catch (e) { console.error(e); }
  try {
    const rawGoals = localStorage.getItem(GOALS_KEY);
    if (rawGoals) state.goals = { ...state.goals, ...JSON.parse(rawGoals) };
  } catch (e) { console.error(e); }
  try {
    state.remindersEnabled = localStorage.getItem(REMINDERS_KEY) === "1";
  } catch (e) { console.error(e); }
  try {
    const raw = localStorage.getItem(COACH_CACHE_KEY);
    if (raw) state.coachNote = JSON.parse(raw);
  } catch (e) { console.error(e); }
  try {
    state.profile = localStorage.getItem(PROFILE_KEY) || "";
  } catch (e) { console.error(e); }
  try {
    const storedBase = localStorage.getItem(API_BASE_KEY);
    // null = never set on this device (use default). "" = user explicitly disconnected — respect that.
    state.apiBase = storedBase !== null ? storedBase : DEFAULT_API_BASE;
    state.apiPin = localStorage.getItem(API_PIN_KEY) || "";
  } catch (e) { console.error(e); }
}
function persist() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.sessions)); }
  catch (e) { showToast("Couldn't save — storage full or blocked.", 3500, "error"); }
}
function persistGoals() {
  try { localStorage.setItem(GOALS_KEY, JSON.stringify(state.goals)); }
  catch (e) { showToast("Couldn't save goals.", 3500, "error"); }
}
// Kept locally for instant reads; schedulePushPrefs mirrors it to the server.
function persistProfile() {
  try { localStorage.setItem(PROFILE_KEY, state.profile); }
  catch (e) { showToast("Couldn't save profile.", 3500, "error"); }
}
function apiConfigured() { return !!state.apiBase; }
let prefsPushTimer = null;
function schedulePushPrefs() {
  if (!apiConfigured()) return;
  clearTimeout(prefsPushTimer);
  prefsPushTimer = setTimeout(pushPrefs, 800);
}
async function pushPrefs() {
  if (!apiConfigured()) return;
  try {
    await apiFetch("/api/prefs", { method: "PUT", body: JSON.stringify({
      profile: state.profile || null,
      coachNote: state.coachNote || null,
    }) });
    state.syncStatus = "synced";
  } catch (e) { state.syncStatus = "error"; }
}
function apiError(message, status) {
  const err = new Error(message);
  err.status = status; // 0 = never reached the server, 408 = we gave up waiting
  return err;
}
async function apiFetch(path, options) {
  options = options || {};
  const url = state.apiBase.replace(/\/$/, "") + path;
  const headers = Object.assign({ "Content-Type": "application/json" }, options.headers || {});
  if (state.apiPin) headers["x-app-pin"] = state.apiPin;
  // Without a timeout a stalled request leaves the UI spinning forever, which
  // is what a slow AI call looks like on a phone. Slow-by-nature endpoints
  // pass their own timeoutMs.
  const timeoutMs = options.timeoutMs || 30000;
  const init = Object.assign({}, options, { headers });
  delete init.timeoutMs;
  const ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
  let timer = null;
  if (ctrl) {
    init.signal = ctrl.signal;
    timer = setTimeout(() => ctrl.abort(), timeoutMs);
  }
  let res;
  try {
    res = await fetch(url, init);
  } catch (e) {
    const timedOut = e && e.name === "AbortError";
    throw apiError(timedOut ? "timed out after " + Math.round(timeoutMs / 1000) + "s" : "network error", timedOut ? 408 : 0);
  } finally {
    if (timer) clearTimeout(timer);
  }
  if (!res.ok) {
    const text = await res.text().catch(() => "");
    // The API reports failures as {"error":"..."} — surface that instead of the
    // raw body so callers can show the server's own explanation.
    let detail = text;
    try { const parsed = JSON.parse(text); if (parsed && parsed.error) detail = String(parsed.error); } catch (e) {}
    throw apiError(detail || ("API " + res.status), res.status);
  }
  try { return await res.json(); } catch (e) { return null; }
}
async function syncFromApi() {
  if (!apiConfigured()) return;
  state.syncStatus = "syncing"; render();
  try {
    const [sessions, goals, prefs] = await Promise.all([
      apiFetch("/api/sessions"), apiFetch("/api/goals"),
      apiFetch("/api/prefs").catch(() => null), // older servers have no /api/prefs
    ]);
    if (Array.isArray(sessions)) { state.sessions = sessions; persist(); }
    if (goals) { state.goals = Object.assign({}, state.goals, goals); persistGoals(); }
    if (prefs) {
      if (typeof prefs.profile === "string") { state.profile = prefs.profile; persistProfile(); }
      else if (state.profile) { schedulePushPrefs(); } // server has none, seed it from here
      if (usableNote(prefs.coachNote)) {
        state.coachNote = prefs.coachNote;
        try { localStorage.setItem(COACH_CACHE_KEY, JSON.stringify(state.coachNote)); } catch (e) {}
      } else if (state.coachNote) { schedulePushPrefs(); }
    }
    state.syncStatus = "synced";
  } catch (e) {
    state.syncStatus = "error";

  }

}
async function pushSessionToApi(session) {
  if (!apiConfigured()) return;
  try { await apiFetch("/api/sessions", { method: "POST", body: JSON.stringify(session) }); state.syncStatus = "synced"; }
  catch (e) { state.syncStatus = "error"; showToast("Saved locally — couldn't sync to cloud"); }
  render();
}
async function deleteSessionFromApi(id) {
  if (!apiConfigured()) return;
  try { await apiFetch("/api/sessions/" + encodeURIComponent(id), { method: "DELETE" }); state.syncStatus = "synced"; }
  catch (e) { state.syncStatus = "error"; showToast("Deleted locally — couldn't sync to cloud"); }
  render();
}
async function replaceSessionsInApi(sessions) {
  if (!apiConfigured()) return;
  try { await apiFetch("/api/sessions", { method: "PUT", body: JSON.stringify(sessions) }); state.syncStatus = "synced"; }
  catch (e) { state.syncStatus = "error"; showToast("Saved locally — couldn't sync to cloud"); }
  render();
}
let goalPushTimer = null;
function schedulePushGoals() {
  if (!apiConfigured()) return;
  if (goalPushTimer) clearTimeout(goalPushTimer);
  goalPushTimer = setTimeout(async () => {
    try { await apiFetch("/api/goals", { method: "PUT", body: JSON.stringify(state.goals) }); state.syncStatus = "synced"; }
    catch (e) { state.syncStatus = "error"; showToast("Saved locally — couldn't sync goals to cloud"); }
    render();
  }, 800);
}
window.saveApiSettings = function () {
  requirePin(() => {
    const baseInput = document.getElementById("f-api-base");
    const pinInput = document.getElementById("f-api-pin");
    const base = baseInput ? baseInput.value.trim().replace(/\/$/, "") : "";
    const pin = pinInput ? pinInput.value.trim() : "";
    state.apiBase = base;
    state.apiPin = pin;
    try {
      localStorage.setItem(API_BASE_KEY, base);
      localStorage.setItem(API_PIN_KEY, pin);
    } catch (e) {}
    if (base) {
      showToast("Cloud sync connected");
      syncFromApi();
    } else {
      state.syncStatus = "";
      showToast("Cloud sync disabled");
      render();
    }
  });
};
window.disconnectApi = function () {
  requirePin(() => {
    state.apiBase = "";
    state.apiPin = "";
    state.syncStatus = "";
    try { localStorage.setItem(API_BASE_KEY, ""); localStorage.removeItem(API_PIN_KEY); } catch (e) {}
    showToast("Cloud sync disconnected — using local storage only");
    render();
  });
};
// kind is "ok", "error" or omitted for a plain acknowledgement. A failure and
// a success used to differ only in their wording.
function showToast(msg, ms, kind) {
  const t = document.getElementById("toast");
  const mark = kind === "ok" ? "✓" : kind === "error" ? "!" : "";
  t.innerHTML = (mark ? `<span class="toast-mark">${mark}</span>` : "") + `<span>${esc(msg)}</span>`;
  t.className = "toast show" + (kind ? " " + kind : "");
  // Clear any previous timer, or a toast that replaces an older one inherits
  // the leftover countdown and flashes past before it can be read.
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => t.classList.remove("show"), ms || 1800);
}

/* ---------- actions (exposed to window for inline handlers) ---------- */
window.setTab = function (tab) { state.tab = tab; render(); };
window.setType = function (type) { state.type = type; render(); };
window.updateShooting = function (key, val) {
  state.shooting[key] = val;
  // Once the user edits a field it's their value, not the screenshot's — drop
  // the scanned/calc'd marker for that field specifically.
  if (state.shooting._ocrFilled) state.shooting._ocrFilled = state.shooting._ocrFilled.filter((k) => k !== key);
  if (state.shooting._ocrDerived) state.shooting._ocrDerived = state.shooting._ocrDerived.filter((k) => k !== key);
  if (["attempts", "makes", "swishes"].includes(key)) {
    state.shooting._ocrLowConfidence = false;
    state.shooting._ocrSwapped = false;
  }
  render();
};
window.updateDribbling = function (key, val) { state.dribbling[key] = val; render(); };
window.updateDate = function (val) { state.date = val; };
window.updateNotes = function (val) { state.notes = val; };
window.updateTime = function (val) { state.time = val; };

window.handleAdd = function () {
  state.error = "";
  if (!state.date) { state.error = "Pick a date."; render(); return; }
  let entry;

  const setIf = (key, val) => {
    if (val !== null && val !== undefined && val !== "") { state.shooting[key] = String(val); filled.push(key); }
  };

    state.type = "shooting";
    setIf("attempts", v.attempts); setIf("makes", v.makes); setIf("swishes", v.swishes);
    setIf("spinRate", v.spinRate); setIf("releaseTime", v.releaseTime); setIf("shotArc", v.shotArc);

    if (v.shotForm) { state.shooting.shotForm = v.shotForm; filled.push("shotForm"); }

  if (v.type === "zones") {

        if (parsed._swapped) swapped = true;
        if (parsed.swishes === null) lowConf = true;
        summary.shooting++; sawShooting = true;
      } else if (type === "dribbling") {
        const parsed = parseDribbleScreenshot(flat);
        state.type = "dribbling";
        if (parsed.drillName) state.dribbling.drillName = parsed.drillName;
        if (parsed.points !== null) state.dribbling.points = parsed.points;
        if (parsed.reps !== null) state.dribbling.reps = parsed.reps;
        if (parsed.date) state.date = parsed.date;
        if (parsed.time) state.time = parsed.time;
        summary.dribbling++;
      } else {
        summary.unknown++;
      }
    }

    // A dribbling card and a shooting screen are different sessions, so if both
    // turned up we can't merge them — tell the user rather than silently mixing.
    if (summary.dribbling > 0 && (sawShooting || sawZones)) {
      showToast("Mixed shooting and dribbling screenshots — log them as separate sessions");
    } else if (summary.unknown === files.length) {
      showToast("Couldn't recognize those screenshots — try clearer photos or enter manually");
    } else {
      const parts = [];
      if (sawShooting) parts.push("session stats");
      if (sawZones) parts.push("zone breakdown");
      if (summary.dribbling) parts.push("dribbling session");
      if (sawBadges) parts.push(`${summary.badges} badge${summary.badges === 1 ? "" : "s"}`);
      const skipped = summary.unknown ? ` (${summary.unknown} not recognized)` : "";
      if (visionFellBack) parts.push("(fell back to basic OCR)");
      showToast(swapped
        ? `Imported ${parts.join(" + ")} — attempts/makes looked swapped, double-check!`
        : `Imported ${parts.join(" + ")}${skipped} — review before logging`);
    }

    state.shooting._ocrLowConfidence = lowConf;
    state.shooting._ocrSwapped = swapped;
    state.lastOcrRaw = rawTexts.join("\n\n----- next screenshot -----\n\n");
  } finally {
    state.ocrBusy = false;
    state.ocrStatus = "";
    input.value = "";
    render();
  }
};

/* ---------- chart instances ---------- */
let charts = {};
function destroyChart(id) { if (charts[id]) { charts[id].destroy(); delete charts[id]; } }

/* ---------- derived data ---------- */
function getMonthKey(dateStr) { return dateStr.slice(0, 7); } // YYYY-MM
function fmtMonthLabel(monthKey) {
  const d = new Date(monthKey + "-01T00:00:00");
  return d.toLocaleDateString("en-US", { month: "long", year: "numeric" });
}
function prevMonthKey(monthKey) {
  const [y, m] = monthKey.split("-").map(Number);
  const d = new Date(y, m - 2, 1); // m is 1-indexed, so m-2 = previous month index
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
}

function computeDerived() {
  const sessions = state.sessions;
  const weekMap = {};
  for (const s of sessions) {
    const wk = getMonday(s.date);
    if (!weekMap[wk]) weekMap[wk] = { week: wk, attempts: 0, makes: 0, points: 0, reps: 0, close: 0, mid: 0, long: 0, dribbleMin: 0, hasShooting: false, hasDribbling: false };
    if (s.type === "shooting") {
      weekMap[wk].attempts += s.attempts;
      weekMap[wk].makes += s.makes;
      weekMap[wk].close += s.closeMakes || 0;
      weekMap[wk].mid += s.midMakes || 0;
      weekMap[wk].long += s.longMakes || 0;
      weekMap[wk].hasShooting = true;
    } else {
      weekMap[wk].points += s.points;
      weekMap[wk].reps += s.reps;
      weekMap[wk].dribbleMin += s.duration || 0;
      weekMap[wk].hasDribbling = true;
    }
  }
  const weekly = Object.values(weekMap).sort((a, b) => a.week.localeCompare(b.week)).map((w) => ({
    ...w, label: fmtWeekLabel(w.week),
    shootingPct: w.attempts > 0 ? Math.round((w.makes / w.attempts) * 1000) / 10 : null,
  }));
  const thisWeekKey = getMonday(todayStr());
  const thisWeek = weekly.find((w) => w.week === thisWeekKey) || { attempts: 0, makes: 0, points: 0, reps: 0, dribbleMin: 0, hasShooting: false, hasDribbling: false };
  const weekSet = new Set(weekly.map((w) => w.week));
  let weekStreak = 0, cursor = thisWeekKey;
  while (weekSet.has(cursor)) { weekStreak++; const d = new Date(cursor + "T00:00:00"); d.setDate(d.getDate() - 7); cursor = localDateStr(d); }
  const shootingSessions = sessions.filter((s) => s.type === "shooting");
  const dribblingSessions = sessions.filter((s) => s.type === "dribbling");
  const totalMakes = shootingSessions.reduce((a, s) => a + s.makes, 0);
  const totalAttempts = shootingSessions.reduce((a, s) => a + s.attempts, 0);
  const overallPct = totalAttempts > 0 ? Math.round((totalMakes / totalAttempts) * 1000) / 10 : null;
  const totalPoints = dribblingSessions.reduce((a, s) => a + s.points, 0);
  const dayStreak = computeDayStreak(sessions);
  const totalClose = shootingSessions.reduce((a, s) => a + (s.closeMakes || 0), 0);
  const totalMid = shootingSessions.reduce((a, s) => a + (s.midMakes || 0), 0);
  const totalLong = shootingSessions.reduce((a, s) => a + (s.longMakes || 0), 0);
  const zoneStats = ["close", "mid", "long"].map((z) => {
    const att = shootingSessions.reduce((a, s) => a + (s[z + "Attempts"] || 0), 0);
    const mk = shootingSessions.reduce((a, s) => a + (s[z + "Makes"] || 0), 0);
    const sw = shootingSessions.reduce((a, s) => a + (s[z + "Swishes"] || 0), 0);
    return {
      zone: z,
      label: z === "close" ? "Close-range" : z === "mid" ? "Mid-range" : "Long-range",
      attempts: att, makes: mk, swishes: sw,
      pct: att > 0 ? Math.round((mk / att) * 1000) / 10 : null,
      swishPct: att > 0 ? Math.round((sw / att) * 1000) / 10 : null,
    };
  });
  const hasZoneAttempts = zoneStats.some((z) => z.attempts > 0);
  const hasZoneData = totalClose + totalMid + totalLong > 0;
  const practicedDates = new Set(sessions.map((s) => s.date));
  const insight = computeInsight(sessions, weekly, dayStreak);
  const eligible = shootingSessions.filter((s) => s.attempts >= 5);
  let bestPct = null;
  for (const s of eligible) { const pct = Math.round((s.makes / s.attempts) * 1000) / 10; if (!bestPct || pct > bestPct.pct) bestPct = { pct, session: s }; }
  let mostMakes = null;
  for (const s of shootingSessions) { if (!mostMakes || s.makes > mostMakes.makes) mostMakes = s; }
  const longestStreak = longestDayStreak(sessions);
  const drillMap = {};
  for (const s of dribblingSessions) {
    const key = s.drillName || "Other";
    if (!drillMap[key]) drillMap[key] = { drillName: key, points: 0, reps: 0, sessions: 0 };
    drillMap[key].points += s.points;
    drillMap[key].reps += s.reps;
    drillMap[key].sessions += 1;
  }
  const drillStats = Object.values(drillMap).sort((a, b) => b.points - a.points);

  const monthMap = {};
  for (const s of sessions) {
    const mk = getMonthKey(s.date);
    if (!monthMap[mk]) monthMap[mk] = { month: mk, attempts: 0, makes: 0, points: 0, reps: 0, dribbleMin: 0 };
    if (s.type === "shooting") { monthMap[mk].attempts += s.attempts; monthMap[mk].makes += s.makes; }
    else { monthMap[mk].points += s.points; monthMap[mk].reps += s.reps; monthMap[mk].dribbleMin += s.duration || 0; }
  }
  const monthlyList = Object.values(monthMap).map((m) => ({ ...m, shootingPct: m.attempts > 0 ? Math.round((m.makes / m.attempts) * 1000) / 10 : null }));
  const thisMonthKey = getMonthKey(todayStr());
  const thisMonth = monthlyList.find((m) => m.month === thisMonthKey) || { attempts: 0, makes: 0, points: 0, reps: 0, dribbleMin: 0, shootingPct: null };
  const lastMonthKey = prevMonthKey(thisMonthKey);
  const lastMonth = monthlyList.find((m) => m.month === lastMonthKey) || { attempts: 0, makes: 0, points: 0, reps: 0, dribbleMin: 0, shootingPct: null };

  // --- Shot mechanics (spin rate, release time, shot arc, intensity) ---
  // These come from the DribbleUp screen but weren't surfaced anywhere before.
  // Show the latest value plus how it compares to the average of prior sessions.
  const mechKeys = ["spinRate", "releaseTime", "shotArc", "intensity"];
  const mechLabels = { spinRate: "Spin rate", releaseTime: "Release time", shotArc: "Shot arc", intensity: "Intensity" };
  const shootingByDate = [...shootingSessions].sort((a, b) => (a.date + (a.time || "")).localeCompare(b.date + (b.time || "")));
  const mechanics = [];
  for (const key of mechKeys) {
    const withVal = shootingByDate.filter((s) => s[key] !== null && s[key] !== undefined);
    if (withVal.length === 0) continue;
    const latest = withVal[withVal.length - 1];
    const priors = withVal.slice(0, -1);
    const priorAvg = priors.length ? Math.round(priors.reduce((a, s) => a + Number(s[key]), 0) / priors.length) : null;
    mechanics.push({
      key,
      label: mechLabels[key],
      latest: Number(latest[key]),
      priorAvg,
      count: withVal.length,
    });
  }
  // A percentage-in-range metric pinned at the floor across every session is
  // far more likely a screenshot the parser cannot read than a real result.
  // "Pinned" rather than "always exactly zero": release time logs 0, 1, 0, 0,
  // and a single 1 should not buy it the benefit of the doubt.
  const suspectMechanics = mechanics.filter((m) => {
    const vals = shootingByDate.map((s) => s[m.key])
      .filter((v) => v !== null && v !== undefined).map(Number);
    if (vals.length < 3) return false;
    return vals.every((v) => v <= 1) && vals.filter((v) => v === 0).length >= vals.length / 2;
  }).map((m) => m.label);

  const formCounts = { Consistent: 0, Inconsistent: 0 };
  for (const s of shootingSessions) {
    const f = (s.shotForm || "").toLowerCase();
    if (f === "consistent") formCounts.Consistent++;
    else if (f === "inconsistent") formCounts.Inconsistent++;
  }
  const latestForm = shootingByDate.filter((s) => s.shotForm).slice(-1)[0];

  // Badge collection: unique by name, keeping the best grade seen and how many
  // times it's been earned.
  const gradeRank = { "A+": 9, "A": 8, "A-": 7, "B+": 6, "B": 5, "B-": 4, "C+": 3, "C": 2, "C-": 1 };
  const badgeMap = {};
  for (const s of shootingByDate) {
    if (!Array.isArray(s.badges)) continue;
    for (const b of s.badges) {
      if (!b || !b.name) continue;
      const key = b.name;
      if (!badgeMap[key]) badgeMap[key] = { name: b.name, grade: b.grade || null, zone: b.zone || null, count: 0, lastDate: s.date };
      badgeMap[key].count++;
      badgeMap[key].lastDate = s.date;
      const cur = badgeMap[key].grade, next = b.grade;
      if (next && (!cur || (gradeRank[next] || 0) > (gradeRank[cur] || 0))) badgeMap[key].grade = next;
    }
  }
  const badgeList = Object.values(badgeMap).sort((a, b) => (gradeRank[b.grade] || 0) - (gradeRank[a.grade] || 0) || b.count - a.count);

  // --- Per-session series -----------------------------------------------
  // Week is too coarse a bucket early on: a handful of sessions collapse into
  // one or two bars and every chart built on them says nothing. The session is
  // the finest grain that always has as many points as there are workouts.
  const pct1 = (m, a) => (a > 0 ? Math.round((m / a) * 1000) / 10 : null);
  const bySession = shootingByDate.map((s) => ({
    date: s.date,
    time: s.time || null,
    label: s.label || null,
    attempts: s.attempts,
    makes: s.makes,
    swishes: s.swishes === null || s.swishes === undefined ? null : s.swishes,
    pct: pct1(s.makes, s.attempts),
    swishPct: pct1(s.swishes || 0, s.attempts),
    zones: ["close", "mid", "long"].reduce((acc, z) => {
      const att = s[z + "Attempts"] || 0;
      acc[z] = { attempts: att, makes: s[z + "Makes"] || 0, pct: pct1(s[z + "Makes"] || 0, att) };
      return acc;
    }, {}),
    spinRate: s.spinRate ?? null,
    releaseTime: s.releaseTime ?? null,
    shotArc: s.shotArc ?? null,
    intensity: s.intensity ?? null,
    duration: s.duration ?? null,
    shotForm: s.shotForm || null,
    shotType: s.shotType || null,
    notes: s.notes || null,
  }));

  // A single career average hides how much a session-to-session figure moves.
  const pctVals = bySession.map((s) => s.pct).filter((v) => v !== null);
  const pctSpread = pctVals.length
    ? {
        min: Math.min(...pctVals),
        max: Math.max(...pctVals),
        latest: pctVals[pctVals.length - 1],
        avg: Math.round((pctVals.reduce((a, v) => a + v, 0) / pctVals.length) * 10) / 10,
        count: pctVals.length,
      }
    : null;

  // Logging one workout twice from two screenshots skews every total, but two
  // real sessions back to back can share an attempt count, so matching
  // attempts alone is not evidence. A double-log reproduces the session
  // totals exactly — attempts, makes and swishes — which two different
  // workouts effectively never do.
  const dupeMap = {};
  for (const s of shootingByDate) {
    const key = [s.date, s.attempts, s.makes, s.swishes === null || s.swishes === undefined ? "" : s.swishes].join("|");
    (dupeMap[key] = dupeMap[key] || []).push(s);
  }
  const duplicates = Object.values(dupeMap)
    .filter((g) => g.length > 1)
    .map((g) => ({
      date: g[0].date,
      attempts: g[0].attempts,
      makes: g[0].makes,
      count: g.length,
      times: g.map((s) => s.time || null),
      ids: g.map((s) => s.id),
      // Identical totals but different zone splits means the same screenshot
      // was read two different ways — the one case worth stating outright.
      conflicting: new Set(g.map((s) => `${s.closeAttempts}|${s.midAttempts}|${s.longAttempts}`)).size > 1,
    }));

  // DribbleUp reports a shot type per session; nothing aggregated it before, so
  // "catch & shoot days go worse than relaxed days" was invisible.
  const typeMap = {};
  for (const s of shootingSessions) {
    if (!s.shotType) continue;
    const name = String(s.shotType).replace(/^\s*\d+%\s*/, "").trim().toLowerCase();
    if (!name) continue;
    if (!typeMap[name]) typeMap[name] = { shotType: name, attempts: 0, makes: 0, sessions: 0 };
    typeMap[name].attempts += s.attempts;
    typeMap[name].makes += s.makes;
    typeMap[name].sessions += 1;
  }
  const shotTypes = Object.values(typeMap)
    .map((t) => ({ ...t, pct: pct1(t.makes, t.attempts) }))
    .sort((a, b) => b.attempts - a.attempts);

  return { bySession, pctSpread, duplicates, shotTypes, suspectMechanics,
    weekly, thisWeek, weekStreak, shootingSessions, dribblingSessions, overallPct, totalPoints, dayStreak, totalClose, totalMid, totalLong, hasZoneData, zoneStats, hasZoneAttempts, practicedDates, insight, bests: { bestPct, mostMakes, longestStreak }, drillStats, thisMonth, lastMonth, thisMonthKey, mechanics, formCounts, latestForm, badgeList };
}

/* ---------- render ---------- */
function render() {
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && typeof active.selectionStart === "number" ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd === "number" ? active.selectionEnd : null;

  const app = document.getElementById("app");
  let syncPillClass = "", syncPillText = "Local only", syncDot = "";
  if (apiConfigured()) {
    if (state.syncStatus === "syncing") { syncPillText = "Syncing…"; }
    else if (state.syncStatus === "synced") { syncPillClass = "synced"; syncPillText = "Synced"; syncDot = '<span class="sync-dot"></span>'; }
    else if (state.syncStatus === "error") { syncPillClass = "error"; syncPillText = "Sync error"; syncDot = '<span class="sync-dot"></span>'; }
    else { syncPillText = "Connecting…"; }
  }
  const header = `
    <div style="padding:22px 20px 14px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
        <div>
          <div class="h-brand" style="font-size:34px;line-height:1;color:var(--ink)">SHOOTING<span class="h-iq">IQ</span></div>
        </div>
        <span class="sync-pill ${syncPillClass}">${syncDot}${syncPillText}</span>
      </div>
    </div>`;

  let body = "";
  let installBanner = "";

// Which figures earn the top of the screen depends on what has been logged, so
// each slide is only built when its data supports it. Order is deliberate:
// where she is now, then the biggest gap, then whether this week is on track.
function buildHeroSlides(d) {
  const slides = [];
  const round1 = (v) => Math.round(v * 10) / 10;
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

  if (d.pctSpread) {
    slides.push({ value: d.pctSpread.latest, suffix: "%", label: "Last session FG%",
      sub: `Career ${d.overallPct}% · ${d.pctSpread.min}–${d.pctSpread.max}% across ${d.pctSpread.count} sessions` });
  } else if (d.overallPct !== null) {
    slides.push({ value: d.overallPct, suffix: "%", label: "Career FG%", sub: "" });
  }

  // Zones need real volume before a percentage means anything.
  const zones = d.zoneStats.filter((z) => z.attempts >= 20 && z.pct !== null);
  if (zones.length >= 2) {
    const worst = zones.reduce((a, z) => (z.pct < a.pct ? z : a));
    const best = zones.reduce((a, z) => (z.pct > a.pct ? z : a));
    slides.push({ value: worst.pct, suffix: "%", label: `${worst.label} FG%`,
      sub: `Weakest zone over ${worst.attempts} attempts · ${best.label} is ${round1(best.pct - worst.pct)} points better` });
  }

  const types = d.shotTypes.filter((t) => t.attempts >= 20);
  if (types.length >= 2) {
    const worst = types.reduce((a, t) => (t.pct < a.pct ? t : a));
    const best = types.reduce((a, t) => (t.pct > a.pct ? t : a));
    slides.push({ value: worst.pct, suffix: "%", label: `${cap(worst.shotType)} FG%`,
      sub: `${round1(best.pct - worst.pct)} points below ${best.shotType} (${best.pct}%) over ${worst.sessions} session${worst.sessions === 1 ? "" : "s"}` });
  }

  slides.push({ value: d.thisWeek.attempts, label: "Shots this week",
    sub: d.thisWeek.attempts >= state.goals.shots
      ? `Weekly goal of ${state.goals.shots} met`
      : `${state.goals.shots - d.thisWeek.attempts} short of ${state.goals.shots}` });

  // The mechanic that has moved furthest against its own prior average.
  const moved = d.mechanics.filter((m) => m.priorAvg !== null)
    .map((m) => ({ ...m, delta: m.latest - m.priorAvg }))
    .sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta))[0];
  if (moved && Math.abs(moved.delta) >= 1) {
    slides.push({ value: moved.latest, suffix: "%", label: `${moved.label} in range`,
      sub: `${moved.delta >= 0 ? "Up" : "Down"} ${Math.abs(Math.round(moved.delta))} points on the average of the ${moved.count - 1} session${moved.count - 1 === 1 ? "" : "s"} before it` });
  }
  return slides;
}

let heroSlideIndex = 0;
window.goHeroSlide = function (i) {
  const t = document.getElementById("hero-track");

};
window.onHeroScroll = function () {
  const t = document.getElementById("hero-track");
  if (!t || !t.clientWidth) return;
  const i = Math.round(t.scrollLeft / t.clientWidth);
  if (i === heroSlideIndex) return;
  heroSlideIndex = i;
  const dots = document.querySelectorAll(".hero-dot");
  dots.forEach((dot, n) => dot.classList.toggle("active", n === i));
};
function restoreHeroSlide() {
  const t = document.getElementById("hero-track");
  if (!t || !heroSlideIndex) return;
  t.scrollLeft = t.clientWidth * heroSlideIndex;
  document.querySelectorAll(".hero-dot").forEach((dot, n) => dot.classList.toggle("active", n === heroSlideIndex));
}
