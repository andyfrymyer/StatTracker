<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0d1b2e" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Ella Tracker" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />
<title>Ella Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700;1,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  :root {
    --navy: #0d1b2e;
    --navy-light: #13243b;
    --navy-line: #233a56;
    --orange: #f47b20;
    --gray: #8a96a8;
    --green: #5fd0a5;
    --blue: #5b9bd5;
  }
  * { box-sizing: border-box; }
  html {
    background: #0d1b2e;
  }
  body {
    margin: 0; background: var(--navy); color: #eef1f6;
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    overscroll-behavior-y: none;
  }
  #app { max-width: 480px; margin: 0 auto; padding-bottom: 100px; }
  .h-brand { font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; }
  .slash { display:inline-block; width:10px; height:1.1em; background:var(--orange); transform: skewX(-16deg); margin: 0 8px; vertical-align: -3px; }
  input, select { font-family: inherit; }
  input:focus, select:focus { outline: 2px solid var(--orange); outline-offset: 1px; }
  input[type=date]::-webkit-calendar-picker-indicator,
  input[type=time]::-webkit-calendar-picker-indicator { filter: invert(0.7); }
  .card { background: var(--navy-light); border: 1px solid var(--navy-line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .stat-card { flex: 1 1 calc(50% - 5px); min-width: 130px; background: var(--navy-light); border: 1px solid var(--navy-line); border-radius: 12px; padding: 12px 10px; }
  .stat-value { font-size: 19px; font-weight: 700; color: #fff; }
  .stat-suffix { font-size: 12px; color: var(--gray); }
  .stat-label { font-size: 10px; color: var(--gray); margin-top: 2px; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .field { margin-bottom: 14px; }
  .field label { font-size: 11.5px; color: var(--gray); text-transform: uppercase; letter-spacing: 0.04em; display:block; margin-bottom: 5px;}
  .input {
    width: 100%; background: var(--navy-light); border: 1px solid var(--navy-line); border-radius: 9px;
    padding: 10px 12px; color: #fff; font-size: 14.5px;
  }
  .btn-primary {
    background: var(--orange); color: var(--navy); border: none; border-radius: 10px; padding: 12px 18px;
    font-weight: 700; font-size: 14px; cursor: pointer;
  }
  .btn-ghost {
    background: transparent; color: var(--gray); border: 1px solid var(--navy-line); border-radius: 10px;
    padding: 12px 18px; font-weight: 700; font-size: 14px; cursor: pointer;
  }
  .btn-link { background:none; border:none; color: var(--gray); font-size:12px; text-decoration: underline; cursor:pointer; }
  .seg-btn {
    flex: 1; padding: 10px 0; border-radius: 9px; font-weight: 700; font-size: 13.5px; cursor: pointer;
    border: 1px solid var(--navy-line); background: transparent; color: var(--gray);
  }
  .seg-btn.active { border-color: var(--orange); background: rgba(244,123,32,0.14); color: var(--orange); }
  .session-row {
    background: var(--navy-light); border: 1px solid var(--navy-line); border-radius: 12px; padding: 12px 14px;
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
  }
  .session-title { font-size: 13.5px; font-weight: 600; color: #fff; }
  .session-sub { font-size: 12px; color: var(--gray); margin-top: 2px; }
  .del-btn { background:none; border:none; color: var(--gray); cursor:pointer; padding: 6px; }
  .section-label { font-size: 11px; color: var(--gray); text-transform: uppercase; letter-spacing: 0.06em; margin: 22px 0 10px; }
  .zone-pill { flex:1; background: var(--navy-light); border: 1px solid var(--navy-line); border-radius: 12px; padding: 10px 8px; text-align:center; }
  .zone-dot { width: 8px; height: 8px; border-radius: 50%; margin: 0 auto 5px; }
  .best-row { background: var(--navy-light); border: 1px solid var(--navy-line); border-radius: 12px; padding: 10px 14px; display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .best-label { font-size: 12.5px; color: #e4e9f1; font-weight: 600; }
  .best-sub { font-size: 11px; color: var(--gray); margin-top: 1px; }
  .best-value { font-size: 17px; font-weight: 700; color: var(--orange); }
  .tabbar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--navy-light); border-top: 1px solid var(--navy-line); }
  .tabbar-inner { max-width: 480px; margin: 0 auto; display: flex; }
  .tab-btn { flex: 1; background: none; border: none; padding: 12px 0 14px; cursor: pointer; color: var(--gray); display:flex; flex-direction:column; align-items:center; gap:3px; }
  .tab-btn.active { color: var(--orange); }
  .toast { position: fixed; bottom: 78px; left: 50%; transform: translateX(-50%); background: var(--orange); color: var(--navy); font-weight:700; font-size:13px; padding: 9px 18px; border-radius: 999px; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 50;}
  .toast.show { opacity: 1; }
  .cal-nav-btn { background:none; border:1px solid var(--navy-line); border-radius:8px; padding:5px 8px; color:#cbd3e0; cursor:pointer; }
  .cal-grid { display:grid; grid-template-columns: repeat(7,1fr); gap:4px; text-align:center; }
  .cal-dow { font-size:10px; color: var(--gray); padding: 2px 0; }
  .cal-cell { display:flex; align-items:center; justify-content:center; padding:2px 0; }
  .cal-day { width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11.5px; color:#cbd3e0; }
  .cal-day.practiced { background: var(--orange); color: var(--navy); font-weight:600; }
  .cal-day.today:not(.practiced) { border: 1.5px solid var(--orange); font-weight:700; }
  .insight-card { display:flex; gap:12px; align-items:flex-start; padding:14px; border-radius:12px; margin-bottom:18px; border:1px solid var(--navy-line); background: var(--navy-light); }
  .insight-card.warning { background: rgba(244,123,32,0.10); border-color: var(--orange); }
  .insight-card.positive { background: rgba(95,208,165,0.10); border-color: var(--green); }
  .insight-title { font-size: 10.5px; color: var(--gray); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
  .insight-text { font-size: 13px; color: #e4e9f1; line-height: 1.45; }
  .chart-title { font-size: 12px; color: #cbd3e0; font-weight: 600; padding: 0 4px 10px; }
  .empty-box { padding: 24px; text-align: center; margin-bottom: 14px; }
  .footer-note { text-align:center; color: var(--gray); font-size: 11px; padding: 24px 20px 4px; line-height:1.5; }
  .trend-row { display:flex; justify-content:space-between; align-items:center; padding: 8px 0; border-bottom: 1px solid var(--navy-line); }
  .trend-row:last-child { border-bottom: none; }
  .trend-label { font-size: 13px; color: #e4e9f1; font-weight: 600; }
  .trend-value { font-size: 15px; color: #fff; font-weight: 700; }
  .trend-delta { font-size: 11.5px; font-weight: 700; margin-left: 6px; }
  .trend-delta.up { color: var(--green); }
  .trend-delta.down { color: #ff8a8a; }
  .trend-delta.flat { color: var(--gray); }
  .reminder-banner { display:flex; gap:12px; align-items:flex-start; padding:14px; border-radius:12px; margin-bottom:14px; border:1px solid var(--orange); background: rgba(244,123,32,0.10); }
  .reminder-banner.ontrack { border-color: var(--green); background: rgba(95,208,165,0.10); }
  .reminder-title { font-size: 10.5px; color: var(--gray); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
  .reminder-text { font-size: 13px; color: #e4e9f1; line-height: 1.45; }
  .reminder-toggle { font-size: 11px; color: var(--gray); text-decoration: underline; background:none; border:none; cursor:pointer; margin-top: 8px; padding: 0; }
  .install-banner { margin: 0 20px 14px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--navy-line); background: var(--navy-light); display:flex; gap:10px; align-items:flex-start; }
  .install-banner-text { font-size: 12.5px; color: #cbd3e0; line-height:1.5; flex:1; }
  .install-banner-close { background:none; border:none; color: var(--gray); cursor:pointer; padding:2px; }
  .import-card { border: 1.5px dashed var(--navy-line); border-radius: 12px; padding: 16px; text-align: center; margin-bottom: 18px; }
  .import-status { font-size: 12px; color: var(--gray); margin-top: 8px; min-height: 16px; }
  .input.ocr-read { border-color: var(--green); box-shadow: inset 0 0 0 1px rgba(95,208,165,0.25); }
  .input.ocr-derived { border-color: #d9a441; box-shadow: inset 0 0 0 1px rgba(217,164,65,0.25); }
  .field-tag { font-size: 9.5px; font-weight: 700; letter-spacing: 0.04em; padding: 1px 5px; border-radius: 4px; margin-left: 6px; text-transform: uppercase; vertical-align: 1px; }
  .field-tag.read { background: rgba(95,208,165,0.18); color: var(--green); }
  .field-tag.derived { background: rgba(217,164,65,0.18); color: #d9a441; }
  .ocr-legend { display:flex; gap:14px; flex-wrap:wrap; font-size:11px; color:var(--gray); margin-bottom:14px; padding: 10px 12px; background: var(--navy-light); border:1px solid var(--navy-line); border-radius:10px; }
  .ocr-legend span { display:inline-flex; align-items:center; gap:5px; }
  .legend-dot { width:8px; height:8px; border-radius:2px; display:inline-block; }
  .spin { display:inline-block; width:12px; height:12px; border: 2px solid var(--navy-line); border-top-color: var(--orange); border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sync-pill { display:inline-flex; align-items:center; gap:5px; font-size:11px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--navy-line); color: var(--gray); }
  .sync-pill.synced { border-color: var(--green); color: var(--green); }
  .sync-pill.error { border-color: var(--orange); color: var(--orange); }
  .sync-dot { width:6px; height:6px; border-radius:50%; background: currentColor; }
  .sync-card .input { margin-top: 5px; }
  #recap-print { display: none; }
  @media print {
    body * { visibility: hidden; }
    #recap-print, #recap-print * { visibility: visible; }
    #recap-print { display: block !important; position: absolute; top: 0; left: 0; width: 100%; background: #fff; color: #0d1b2e; padding: 24px; }
    #recap-print .rp-title { font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 28px; margin-bottom: 4px; }
    #recap-print .rp-sub { font-size: 12px; color: #555; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 0.05em; }
    #recap-print .rp-section { margin-bottom: 18px; }
    #recap-print .rp-label { font-size: 11px; color: #777; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; border-bottom: 1px solid #ddd; padding-bottom: 4px; }
    #recap-print .rp-row { display:flex; justify-content: space-between; font-size: 14px; padding: 4px 0; }
    #recap-print .rp-row strong { color: #f47b20; }
    #recap-print .rp-note { font-size: 12.5px; color: #333; line-height: 1.5; padding: 10px 12px; border-left: 3px solid #f47b20; background: #fdf3ea; margin-top: 8px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="recap-print"></div>
<div id="toast" class="toast"></div>
<input type="file" id="importFile" accept="application/json" style="display:none" />

<script>
/* ---------- storage & helpers ---------- */
const STORAGE_KEY = "ella-sessions-standalone";
const GOALS_KEY = "ella-goals-standalone";
const REMINDERS_KEY = "ella-reminders-standalone";
const LAST_NOTIFIED_KEY = "ella-last-notified-standalone";
const PIN_KEY = "ella-pin-standalone";
const API_BASE_KEY = "ella-api-base-standalone";
const API_PIN_KEY = "ella-api-pin-standalone";
// Baked-in default so a fresh browser/device connects automatically without
// re-typing the URL. Safe to make public — it's not a secret, just an address.
// Leave as "" if you don't want a default (e.g. before you've deployed one).
const DEFAULT_API_BASE = "https://ella-tracker-api-production.up.railway.app";

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function todayStr() { return new Date().toISOString().slice(0, 10); }
function addDays(dateStr, n) {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
}
function getMonday(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  return d.toISOString().slice(0, 10);
}
function fmtShort(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
}
function fmtWeekLabel(mondayStr) {
  const d = new Date(mondayStr + "T00:00:00");
  return "Wk of " + d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
}
function fmtTime(t) {
  if (!t) return "";
  const [h, m] = t.split(":").map(Number);
  const period = h >= 12 ? "PM" : "AM";
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${h12}:${String(m).padStart(2, "0")} ${period}`;
}
function nowTimeStr() {
  const d = new Date();
  return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}
function isIOS() { return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream; }
function isStandalone() { return window.navigator.standalone === true || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches); }
function computeDayStreak(sessions) {
  const dateSet = new Set(sessions.map((s) => s.date));
  let cursor = todayStr();
  if (!dateSet.has(cursor)) {
    cursor = addDays(cursor, -1);
    if (!dateSet.has(cursor)) return 0;
  }
  let count = 0;
  while (dateSet.has(cursor)) { count++; cursor = addDays(cursor, -1); }
  return count;
}
function longestDayStreak(sessions) {
  const dates = Array.from(new Set(sessions.map((s) => s.date))).sort();
  let best = 0, cur = 0, prev = null;
  for (const d of dates) {
    cur = prev && addDays(prev, 1) === d ? cur + 1 : 1;
    if (cur > best) best = cur;
    prev = d;
  }
  return best;
}
function getMonthMatrix(year, month) {
  const firstDay = new Date(year, month, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) {
    cells.push(`${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`);
  }
  return cells;
}
function computePace(thisWeek, goals) {
  const monday = getMonday(todayStr());
  const daysElapsed = Math.floor((new Date(todayStr() + "T00:00:00") - new Date(monday + "T00:00:00")) / 86400000) + 1; // 1..7
  const expectedShots = Math.round((goals.shots * daysElapsed) / 7);
  const expectedDribbleMin = Math.round((goals.dribbleMinutes * daysElapsed) / 7);
  const shotsBehind = Math.max(0, expectedShots - thisWeek.attempts);
  const dribbleBehind = Math.max(0, expectedDribbleMin - thisWeek.dribbleMin);
  const onTrack = shotsBehind === 0 && dribbleBehind === 0;
  return { daysElapsed, expectedShots, expectedDribbleMin, shotsBehind, dribbleBehind, onTrack };
}
function computeInsight(sessions, weekly, dayStreak) {
  const shootSessions = sessions.filter((s) => s.type === "shooting").sort((a, b) => a.date.localeCompare(b.date));
  let formStreak = 0;
  for (let i = shootSessions.length - 1; i >= 0; i--) {
    if ((shootSessions[i].shotForm || "").toLowerCase() === "inconsistent") formStreak++;
    else break;
  }
  if (formStreak >= 3) {
    return { tone: "warning", text: `Shot form logged inconsistent in ${formStreak} straight sessions. Worth dialing back volume and rebuilding a repeatable release before adding more reps.` };
  }
  const weeksWithPct = weekly.filter((w) => w.shootingPct !== null);
  if (weeksWithPct.length >= 3) {
    const last3 = weeksWithPct.slice(-3);
    if (last3[0].shootingPct > last3[1].shootingPct && last3[1].shootingPct > last3[2].shootingPct) {
      return { tone: "warning", text: `FG% has dropped 3 straight weeks (${last3[0].shootingPct}% → ${last3[2].shootingPct}%). Might be fatigue or volume — consider shorter, higher-quality sessions.` };
    }
    if (last3[0].shootingPct < last3[1].shootingPct && last3[1].shootingPct < last3[2].shootingPct) {
      return { tone: "positive", text: `FG% has climbed 3 straight weeks (${last3[0].shootingPct}% → ${last3[2].shootingPct}%). Whatever's happening in warmups is working — keep the reps consistent.` };
    }
  }
  if (dayStreak === 0 && sessions.length > 0) {
    return { tone: "neutral", text: "No session logged today or yesterday — get one in to keep the streak alive." };
  }
  if (dayStreak >= 5) {
    return { tone: "positive", text: `${dayStreak}-day practice streak. Consistency like this is what separates good shooters from great ones.` };
  }
  if (shootSessions.length > 0) {
    const last = shootSessions[shootSessions.length - 1];
    const pct = last.attempts > 0 ? Math.round((last.makes / last.attempts) * 100) : 0;
    return { tone: "neutral", text: `Last session: ${last.makes}/${last.attempts} (${pct}%). Keep stacking reps — trends need a few more sessions to show clearly.` };
  }
  return { tone: "neutral", text: "Log a few sessions and coaching tips will start showing up here." };
}
function buildDemoSessions() {
  const start = addDays(todayStr(), -27);
  const shootLabels = ["Shootaround", "Catch & Shoot", "Off the Dribble", "Free Throws + Mid"];
  const drillNames = ["Tight Handles", "Two-Ball Series", "Cone Weave", "Live Ball Combo"];
  const out = [];
  for (let week = 0; week < 4; week++) {
    const weekStart = addDays(start, week * 7);
    [0, 2, 4].forEach((offset, i) => {
      const attempts = 70 + week * 8 + Math.round(Math.random() * 15);
      const basePct = 0.34 + week * 0.03 + Math.random() * 0.05;
      const makes = Math.round(attempts * basePct);
      const closeMakes = Math.round(makes * 0.5);
      const midMakes = Math.round(makes * 0.32);
      const longMakes = Math.max(0, makes - closeMakes - midMakes);
      out.push({
        id: uid(), type: "shooting", date: addDays(weekStart, offset),
        time: `${16 + Math.round(Math.random() * 3)}:${String(Math.round(Math.random() * 59)).padStart(2, "0")}`,
        label: shootLabels[(week + i) % shootLabels.length],
        attempts, makes, closeMakes, midMakes, longMakes,
        swishes: Math.round(makes * (0.35 + Math.random() * 0.15)),
        spinRate: 8 + Math.round(Math.random() * 10),
        releaseTime: Math.round(Math.random() * 20),
        shotArc: 45 + Math.round(Math.random() * 25),
        shotForm: week < 2 ? "Inconsistent" : "Consistent",
        shotType: `${40 + Math.round(Math.random() * 20)}% relaxed`,
        duration: 20 + Math.round(Math.random() * 15),
        intensity: Math.round(Math.random() * 30),
      });
    });
    [1, 5].forEach((offset, i) => {
      const reps = 140 + week * 15 + Math.round(Math.random() * 20);
      const points = Math.round(reps * (4 + week * 0.3 + Math.random()));
      out.push({
        id: uid(), type: "dribbling", date: addDays(weekStart, offset),
        time: `${16 + Math.round(Math.random() * 3)}:${String(Math.round(Math.random() * 59)).padStart(2, "0")}`,
        drillName: drillNames[(week + i) % drillNames.length],
        points, reps, duration: 15 + Math.round(Math.random() * 10),
      });
    });
  }
  return out.sort((a, b) => a.date.localeCompare(b.date));
}

/* ---------- state ---------- */
let state = {
  sessions: [],
  goals: { shots: 500, dribbleMinutes: 30 },
  remindersEnabled: false,
  tab: "dashboard",
  type: "shooting",
  date: todayStr(),
  time: nowTimeStr(),
  shooting: emptyShooting(),
  dribbling: emptyDribbling(),
  calOffset: 0,
  error: "",
  ocrBusy: false,
  ocrStatus: "",
  lastOcrRaw: "",
  showOcrDebug: false,
  apiBase: "",
  apiPin: "",
  syncStatus: "", // "", "syncing", "synced", "error", "offline"
};
function emptyShooting() {
  return { attempts: "", makes: "", swishes: "", spinRate: "", releaseTime: "", shotArc: "", shotForm: "", shotType: "", duration: "", intensity: "", label: "Shootaround",
    closeMakes: "", midMakes: "", longMakes: "",
    closeAttempts: "", midAttempts: "", longAttempts: "",
    closeSwishes: "", midSwishes: "", longSwishes: "" };
}
function emptyDribbling() { return { drillName: "Tight Handles", points: "", reps: "", duration: "" }; }

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state.sessions = JSON.parse(raw);
  } catch (e) { console.error(e); }
  try {
    const rawGoals = localStorage.getItem(GOALS_KEY);
    if (rawGoals) state.goals = { ...state.goals, ...JSON.parse(rawGoals) };
  } catch (e) { console.error(e); }
  try {
    state.remindersEnabled = localStorage.getItem(REMINDERS_KEY) === "1";
  } catch (e) { console.error(e); }
  try {
    const storedBase = localStorage.getItem(API_BASE_KEY);
    // null = never set on this device (use default). "" = user explicitly disconnected — respect that.
    state.apiBase = storedBase !== null ? storedBase : DEFAULT_API_BASE;

function persist() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.sessions)); }

function apiConfigured() { return !!state.apiBase; }
async function apiFetch(path, options) {
  options = options || {};
  const url = state.apiBase.replace(/\/$/, "") + path;
  const headers = Object.assign({ "Content-Type": "application/json" }, options.headers || {});
  if (state.apiPin) headers["x-app-pin"] = state.apiPin;
  const res = await fetch(url, Object.assign({}, options, { headers }));
  if (!res.ok) {

}

    if (Array.isArray(sessions)) { state.sessions = sessions; persist(); }
    if (goals) { state.goals = Object.assign({}, state.goals, goals); persistGoals(); }

}

window.handleScreenshotImport = async function (input) {
  const files = input.files ? Array.from(input.files) : [];
  if (!files.length) return;
  if (typeof Tesseract === "undefined") {
    showToast("OCR library failed to load — check your connection");
    input.value = "";
    return;
  }
  state.ocrBusy = true;
  render();

  const summary = { shooting: 0, zones: 0, dribbling: 0, unknown: 0 };
  let sawShooting = false, sawZones = false, swapped = false, lowConf = false;
  const rawTexts = [];

  try {
    for (let i = 0; i < files.length; i++) {
      state.ocrStatus = files.length > 1
        ? `Reading screenshot ${i + 1} of ${files.length}…`
        : "Reading screenshot… this can take up to 15 seconds";
      render();

      let flat;
      try {
        const { data: { text } } = await Tesseract.recognize(files[i], "eng");
        flat = flattenOcrText(text);
      } catch (err) {
        summary.unknown++;
        continue;
      }
      rawTexts.push(flat);
      const type = detectScreenshotType(flat);

      if (type === "zones") {
        const parsed = parseZoneScreenshot(flat);
        state.type = "shooting";
        const zoneKeys = ["closeAttempts", "closeMakes", "closeSwishes", "midAttempts", "midMakes", "midSwishes", "longAttempts", "longMakes", "longSwishes"];
        const filled = [];
        for (const key of zoneKeys) {
          if (parsed[key] !== undefined) { state.shooting[key] = parsed[key]; filled.push(key); }
        }
        if (!state.shooting.attempts && parsed._zoneTotalAttempts) state.shooting.attempts = parsed._zoneTotalAttempts;
        state.shooting._ocrFilled = [...new Set([...(state.shooting._ocrFilled || []), ...filled.filter((k) => k.endsWith("Attempts"))])];
        state.shooting._ocrDerived = [...new Set([...(state.shooting._ocrDerived || []), ...filled.filter((k) => !k.endsWith("Attempts"))])];
        if (filled.length) { summary.zones++; sawZones = true; }
        else summary.unknown++;
      } else if (type === "shooting") {
        const parsed = parseShootScreenshot(flat);
        state.type = "shooting";
        const filled = [];
        for (const key of ["attempts", "makes", "swishes", "spinRate", "releaseTime", "shotArc", "shotForm", "shotType", "duration", "intensity", "label"]) {
          if (parsed[key] !== null && parsed[key] !== undefined) {
            state.shooting[key] = parsed[key];
            if (key !== "label") filled.push(key);
          }
        }
        const derivedList = parsed._derived || [];
        state.shooting._ocrFilled = [...new Set([...(state.shooting._ocrFilled || []), ...filled.filter((k) => !derivedList.includes(k))])];
        state.shooting._ocrDerived = [...new Set([...(state.shooting._ocrDerived || []), ...derivedList])];
        if (parsed._swapped) swapped = true;
        if (parsed.swishes === null) lowConf = true;
        summary.shooting++; sawShooting = true;
      } else if (type === "dribbling") {
        const parsed = parseDribbleScreenshot(flat);
        state.type = "dribbling";
        if (parsed.drillName) state.dribbling.drillName = parsed.drillName;
        if (parsed.points !== null) state.dribbling.points = parsed.points;
        if (parsed.reps !== null) state.dribbling.reps = parsed.reps;
        if (parsed.date) state.date = parsed.date;
        if (parsed.time) state.time = parsed.time;
        summary.dribbling++;
      } else {
        summary.unknown++;
      }
    }

    // A dribbling card and a shooting screen are different sessions, so if both
    // turned up we can't merge them — tell the user rather than silently mixing.
    if (summary.dribbling > 0 && (sawShooting || sawZones)) {
      showToast("Mixed shooting and dribbling screenshots — log them as separate sessions");
    } else if (summary.unknown === files.length) {
      showToast("Couldn't recognize those screenshots — try clearer photos or enter manually");
    } else {
      const parts = [];
      if (sawShooting) parts.push("session stats");
      if (sawZones) parts.push("zone breakdown");
      if (summary.dribbling) parts.push("dribbling session");
      const skipped = summary.unknown ? ` (${summary.unknown} not recognized)` : "";
      showToast(swapped
        ? `Imported ${parts.join(" + ")} — attempts/makes looked swapped, double-check!`
        : `Imported ${parts.join(" + ")}${skipped} — review before logging`);
    }

    state.shooting._ocrLowConfidence = lowConf;
    state.shooting._ocrSwapped = swapped;
    state.lastOcrRaw = rawTexts.join("\n\n----- next screenshot -----\n\n");
  } finally {
    state.ocrBusy = false;
    state.ocrStatus = "";
    input.value = "";
    render();
  }
};

/* ---------- chart instances ---------- */
let charts = {};
function destroyChart(id) { if (charts[id]) { charts[id].destroy(); delete charts[id]; } }

/* ---------- derived data ---------- */
function getMonthKey(dateStr) { return dateStr.slice(0, 7); } // YYYY-MM
function fmtMonthLabel(monthKey) {
  const d = new Date(monthKey + "-01T00:00:00");
  return d.toLocaleDateString("en-US", { month: "long", year: "numeric" });
}
function prevMonthKey(monthKey) {
  const [y, m] = monthKey.split("-").map(Number);
  const d = new Date(y, m - 2, 1); // m is 1-indexed, so m-2 = previous month index
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
}

function computeDerived() {
  const sessions = state.sessions;
  const weekMap = {};
  for (const s of sessions) {
    const wk = getMonday(s.date);
    if (!weekMap[wk]) weekMap[wk] = { week: wk, attempts: 0, makes: 0, points: 0, reps: 0, close: 0, mid: 0, long: 0, dribbleMin: 0, hasShooting: false, hasDribbling: false };
    if (s.type === "shooting") {
      weekMap[wk].attempts += s.attempts;
      weekMap[wk].makes += s.makes;
      weekMap[wk].close += s.closeMakes || 0;
      weekMap[wk].mid += s.midMakes || 0;
      weekMap[wk].long += s.longMakes || 0;
      weekMap[wk].hasShooting = true;
    } else {
      weekMap[wk].points += s.points;
      weekMap[wk].reps += s.reps;
      weekMap[wk].dribbleMin += s.duration || 0;
      weekMap[wk].hasDribbling = true;
    }
  }
  const weekly = Object.values(weekMap).sort((a, b) => a.week.localeCompare(b.week)).map((w) => ({
    ...w, label: fmtWeekLabel(w.week),
    shootingPct: w.attempts > 0 ? Math.round((w.makes / w.attempts) * 1000) / 10 : null,
  }));
  const thisWeekKey = getMonday(todayStr());
  const thisWeek = weekly.find((w) => w.week === thisWeekKey) || { attempts: 0, makes: 0, points: 0, reps: 0, dribbleMin: 0, hasShooting: false, hasDribbling: false };
  const weekSet = new Set(weekly.map((w) => w.week));
  let weekStreak = 0, cursor = thisWeekKey;
  while (weekSet.has(cursor)) { weekStreak++; const d = new Date(cursor + "T00:00:00"); d.setDate(d.getDate() - 7); cursor = d.toISOString().slice(0, 10); }
  const shootingSessions = sessions.filter((s) => s.type === "shooting");
  const dribblingSessions = sessions.filter((s) => s.type === "dribbling");
  const totalMakes = shootingSessions.reduce((a, s) => a + s.makes, 0);
  const totalAttempts = shootingSessions.reduce((a, s) => a + s.attempts, 0);
  const overallPct = totalAttempts > 0 ? Math.round((totalMakes / totalAttempts) * 1000) / 10 : null;
  const totalPoints = dribblingSessions.reduce((a, s) => a + s.points, 0);
  const dayStreak = computeDayStreak(sessions);
  const totalClose = shootingSessions.reduce((a, s) => a + (s.closeMakes || 0), 0);
  const totalMid = shootingSessions.reduce((a, s) => a + (s.midMakes || 0), 0);
  const totalLong = shootingSessions.reduce((a, s) => a + (s.longMakes || 0), 0);
  const zoneStats = ["close", "mid", "long"].map((z) => {
    const att = shootingSessions.reduce((a, s) => a + (s[z + "Attempts"] || 0), 0);
    const mk = shootingSessions.reduce((a, s) => a + (s[z + "Makes"] || 0), 0);
    const sw = shootingSessions.reduce((a, s) => a + (s[z + "Swishes"] || 0), 0);
    return {
      zone: z,
      label: z === "close" ? "Close-range" : z === "mid" ? "Mid-range" : "Long-range",
      attempts: att, makes: mk, swishes: sw,
      pct: att > 0 ? Math.round((mk / att) * 1000) / 10 : null,
      swishPct: att > 0 ? Math.round((sw / att) * 1000) / 10 : null,
    };
  });
  const hasZoneAttempts = zoneStats.some((z) => z.attempts > 0);
  const hasZoneData = totalClose + totalMid + totalLong > 0;
  const practicedDates = new Set(sessions.map((s) => s.date));
  const insight = computeInsight(sessions, weekly, dayStreak);
  const eligible = shootingSessions.filter((s) => s.attempts >= 5);
  let bestPct = null;
  for (const s of eligible) { const pct = Math.round((s.makes / s.attempts) * 1000) / 10; if (!bestPct || pct > bestPct.pct) bestPct = { pct, session: s }; }
  let mostMakes = null;
  for (const s of shootingSessions) { if (!mostMakes || s.makes > mostMakes.makes) mostMakes = s; }
  const longestStreak = longestDayStreak(sessions);
  const drillMap = {};
  for (const s of dribblingSessions) {
    const key = s.drillName || "Other";
    if (!drillMap[key]) drillMap[key] = { drillName: key, points: 0, reps: 0, sessions: 0 };
    drillMap[key].points += s.points;
    drillMap[key].reps += s.reps;
    drillMap[key].sessions += 1;
  }
  const drillStats = Object.values(drillMap).sort((a, b) => b.points - a.points);

  const monthMap = {};
  for (const s of sessions) {
    const mk = getMonthKey(s.date);
    if (!monthMap[mk]) monthMap[mk] = { month: mk, attempts: 0, makes: 0, points: 0, reps: 0, dribbleMin: 0 };
    if (s.type === "shooting") { monthMap[mk].attempts += s.attempts; monthMap[mk].makes += s.makes; }
    else { monthMap[mk].points += s.points; monthMap[mk].reps += s.reps; monthMap[mk].dribbleMin += s.duration || 0; }
  }
  const monthlyList = Object.values(monthMap).map((m) => ({ ...m, shootingPct: m.attempts > 0 ? Math.round((m.makes / m.attempts) * 1000) / 10 : null }));
  const thisMonthKey = getMonthKey(todayStr());
  const thisMonth = monthlyList.find((m) => m.month === thisMonthKey) || { attempts: 0, makes: 0, points: 0, reps: 0, dribbleMin: 0, shootingPct: null };
  const lastMonthKey = prevMonthKey(thisMonthKey);
  const lastMonth = monthlyList.find((m) => m.month === lastMonthKey) || { attempts: 0, makes: 0, points: 0, reps: 0, dribbleMin: 0, shootingPct: null };

  // --- Shot mechanics (spin rate, release time, shot arc, intensity) ---
  // These come from the DribbleUp screen but weren't surfaced anywhere before.
  // Show the latest value plus how it compares to the average of prior sessions.
  const mechKeys = ["spinRate", "releaseTime", "shotArc", "intensity"];
  const mechLabels = { spinRate: "Spin rate", releaseTime: "Release time", shotArc: "Shot arc", intensity: "Intensity" };
  const shootingByDate = [...shootingSessions].sort((a, b) => (a.date + (a.time || "")).localeCompare(b.date + (b.time || "")));
  const mechanics = [];
  for (const key of mechKeys) {
    const withVal = shootingByDate.filter((s) => s[key] !== null && s[key] !== undefined);
    if (withVal.length === 0) continue;
    const latest = withVal[withVal.length - 1];
    const priors = withVal.slice(0, -1);
    const priorAvg = priors.length ? Math.round(priors.reduce((a, s) => a + Number(s[key]), 0) / priors.length) : null;
    mechanics.push({
      key,
      label: mechLabels[key],
      latest: Number(latest[key]),
      priorAvg,
      count: withVal.length,
    });
  }
  const formCounts = { Consistent: 0, Inconsistent: 0 };
  for (const s of shootingSessions) {
    const f = (s.shotForm || "").toLowerCase();
    if (f === "consistent") formCounts.Consistent++;
    else if (f === "inconsistent") formCounts.Inconsistent++;
  }
  const latestForm = shootingByDate.filter((s) => s.shotForm).slice(-1)[0];

  return { weekly, thisWeek, weekStreak, shootingSessions, dribblingSessions, overallPct, totalPoints, dayStreak, totalClose, totalMid, totalLong, hasZoneData, zoneStats, hasZoneAttempts, practicedDates, insight, bests: { bestPct, mostMakes, longestStreak }, drillStats, thisMonth, lastMonth, thisMonthKey, mechanics, formCounts, latestForm };
}

/* ---------- render ---------- */
function render() {
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && typeof active.selectionStart === "number" ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd === "number" ? active.selectionEnd : null;

  const app = document.getElementById("app");
  let syncPillClass = "", syncPillText = "Local only", syncDot = "";
  if (apiConfigured()) {
    if (state.syncStatus === "syncing") { syncPillText = "Syncing…"; }
    else if (state.syncStatus === "synced") { syncPillClass = "synced"; syncPillText = "Synced"; syncDot = '<span class="sync-dot"></span>'; }
    else if (state.syncStatus === "error") { syncPillClass = "error"; syncPillText = "Sync error"; syncDot = '<span class="sync-dot"></span>'; }
    else { syncPillText = "Connecting…"; }
  }
  const header = `
    <div style="padding:28px 20px 18px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
        <div>
          <div class="h-brand" style="font-size:30px;line-height:1;color:#fff">ELLA<span class="slash"></span>TRACKER</div>
          <div style="font-size:12.5px;color:var(--gray);margin-top:6px;letter-spacing:0.03em;text-transform:uppercase">Same Standards. Relentless Growth.</div>
        </div>
        <span class="sync-pill ${syncPillClass}">${syncDot}${syncPillText}</span>
      </div>
    </div>`;

  let body = "";
  let installBanner = "";
  try {
    const dismissed = localStorage.getItem("ella-install-hint-dismissed") === "1";
    if (isIOS() && !isStandalone() && !dismissed) {
      installBanner = `<div class="install-banner">
        <div class="install-banner-text">Add this to your home screen: tap <strong>Share</strong> (square with an arrow) in Safari's toolbar, then <strong>Add to Home Screen</strong>. It'll open full-screen like an app.</div>
        <button class="install-banner-close" onclick="dismissInstallHint()">✕</button>
      </div>`;
    }
  } catch (e) {}

  if (state.tab === "dashboard") body = renderDashboard();
  else body = renderLogForm();

  const tabbar = `
    <div class="tabbar"><div class="tabbar-inner">
      <button class="tab-btn ${state.tab === "dashboard" ? "active" : ""}" onclick="setTab('dashboard')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
        <span style="font-size:10.5px;font-weight:600">Dashboard</span>
      </button>
      <button class="tab-btn ${state.tab === "log" ? "active" : ""}" onclick="setTab('log')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span style="font-size:10.5px;font-weight:600">Log Session</span>
      </button>
    </div></div>`;

  app.innerHTML = header + installBanner + body + tabbar +
    `<div class="footer-note">Data is stored in this browser only (not synced across devices).<br/>Use Export/Import to move it or back it up.</div>`;

  if (state.sessions.length > 0 && state.tab === "dashboard") {
    drawCharts();
    maybeNotify(false);
  }

  if (activeId) {
    const el = document.getElementById(activeId);
    if (el) {
      el.focus();
      if (selStart !== null && typeof el.setSelectionRange === "function") {
        try { el.setSelectionRange(selStart, selEnd); } catch (e) {}
      }
    }
  }
}

function renderSyncCard() {
  return `<div class="card sync-card">
    <div class="section-label" style="margin:0 0 10px">Cloud Sync (Railway)</div>
    <div style="font-size:12px;color:var(--gray);margin-bottom:12px;line-height:1.5">Connect your Railway API so data syncs across every device, not just this browser.</div>
    <div class="field" style="margin-bottom:10px">
      <label>API URL</label>
      <input class="input" id="f-api-base" type="text" placeholder="https://your-app.up.railway.app" value="${state.apiBase}" />
    </div>
    <div class="field" style="margin-bottom:12px">
      <label>Sync PIN (if set on server)</label>

    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn-primary" onclick="saveApiSettings()">Save & Connect</button>

}

function renderDashboard() {
  if (state.sessions.length === 0) {
    return `
      <div style="padding:0 20px">
        <div class="card empty-box">
          <div style="font-size:15px;color:#cbd3e0;margin-bottom:14px">No sessions logged yet.</div>

            <button class="btn-ghost" onclick="loadDemo()">Load demo month</button>
          </div>
        </div>
        ${renderSyncCard()}
      </div>`;
  }

  const d = computeDerived();
  const flame = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${'var(--orange)'}" stroke-width="2"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 17a2.5 2.5 0 0 0 2.5-2.5c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7.5 7.5 0 1 1-15 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>`;
  const target = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--orange)" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>`;
  const zap = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--orange)" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>`;

  let html = `<div style="padding:0 20px">`;

  html += `<div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px">
    <div class="stat-card"><div style="margin-bottom:6px">${flame}</div><div class="stat-value">${d.dayStreak}<span class="stat-suffix">${d.dayStreak === 1 ? " day" : " days"}</span></div><div class="stat-label">Day Streak</div></div>
    <div class="stat-card"><div style="margin-bottom:6px">${flame}</div><div class="stat-value">${d.weekStreak}<span class="stat-suffix">${d.weekStreak === 1 ? "wk" : "wks"}</span></div><div class="stat-label">Week Streak</div></div>
    <div class="stat-card"><div style="margin-bottom:6px">${target}</div><div class="stat-value">${d.overallPct !== null ? d.overallPct : "—"}<span class="stat-suffix">${d.overallPct !== null ? "%" : ""}</span></div><div class="stat-label">Career FG%</div></div>
    <div class="stat-card"><div style="margin-bottom:6px">${zap}</div><div class="stat-value">${d.totalPoints}</div><div class="stat-label">Dribble Pts</div></div>
  </div>`;

  const pace = computePace(d.thisWeek, state.goals);
  const paceParts = [];
  if (pace.shotsBehind > 0) paceParts.push(`${pace.shotsBehind} more shots`);
  if (pace.dribbleBehind > 0) paceParts.push(`${pace.dribbleBehind} more DribbleUp min`);
  const paceText = pace.onTrack
    ? "On pace for both weekly goals — keep it up."
    : `Behind pace: needs ${paceParts.join(" and ")} to stay on track for Sunday.`;
  html += `<div class="reminder-banner ${pace.onTrack ? "ontrack" : ""}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${pace.onTrack ? "var(--green)" : "var(--orange)"}" stroke-width="2" style="flex-shrink:0;margin-top:2px"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    <div style="flex:1">
      <div class="reminder-title">Practice Reminder</div>
      <div class="reminder-text">${paceText}</div>
      ${state.remindersEnabled
        ? `<button class="reminder-toggle" onclick="disableReminders()">Turn off notifications</button>`
        : `<button class="reminder-toggle" onclick="enableReminders()">Enable browser notifications</button>`}
    </div>
  </div>`;

  const insightColor = d.insight.tone === "warning" ? "var(--orange)" : d.insight.tone === "positive" ? "var(--green)" : "var(--gray)";
  html += `<div class="insight-card ${d.insight.tone}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${insightColor}" stroke-width="2" style="flex-shrink:0;margin-top:2px"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
    <div><div class="insight-title">Coach's Note</div><div class="insight-text">${d.insight.text}</div></div>
  </div>`;

  if (d.bests.bestPct || d.bests.mostMakes) {
    html += `<div style="margin-bottom:18px"><div class="section-label" style="margin:0 0 8px">Personal Bests</div>`;
    if (d.bests.bestPct) html += `<div class="best-row"><div><div class="best-label">Best FG% (session)</div><div class="best-sub">${d.bests.bestPct.session.makes}/${d.bests.bestPct.session.attempts} · ${fmtShort(d.bests.bestPct.session.date)}</div></div><div class="best-value">${d.bests.bestPct.pct}%</div></div>`;
    if (d.bests.mostMakes) html += `<div class="best-row"><div><div class="best-label">Most makes (session)</div><div class="best-sub">${d.bests.mostMakes.attempts} attempts · ${fmtShort(d.bests.mostMakes.date)}</div></div><div class="best-value">${d.bests.mostMakes.makes}</div></div>`;
    html += `<div class="best-row"><div><div class="best-label">Longest practice streak</div><div class="best-sub">all-time</div></div><div class="best-value">${d.bests.longestStreak} ${d.bests.longestStreak === 1 ? "day" : "days"}</div></div>`;
    html += `</div>`;
  }

  const shotsPct = Math.min(100, Math.round((d.thisWeek.attempts / Math.max(1, state.goals.shots)) * 100));
  const dribblePct = Math.min(100, Math.round((d.thisWeek.dribbleMin / Math.max(1, state.goals.dribbleMinutes)) * 100));
  const shotsMet = d.thisWeek.attempts >= state.goals.shots;
  const dribbleMet = d.thisWeek.dribbleMin >= state.goals.dribbleMinutes;
  html += `<div class="card">
    <div style="font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:12px">Weekly Goals</div>
    <div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
        <span style="font-size:13px;color:#e4e9f1;font-weight:600">Shots</span>
        <span style="font-size:12.5px;color:${shotsMet ? "var(--green)" : "var(--gray)"}">${d.thisWeek.attempts} / <input class="input" id="f-goal-shots" type="number" min="1" value="${state.goals.shots}" oninput="updateGoal('shots', this.value)" style="display:inline-block;width:56px;padding:2px 6px;font-size:12.5px;text-align:center" /></span>
      </div>
      <div style="height:8px;border-radius:99px;background:var(--navy-line);overflow:hidden">
        <div style="height:100%;width:${shotsPct}%;background:${shotsMet ? "var(--green)" : "var(--orange)"};border-radius:99px"></div>
      </div>
    </div>
    <div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
        <span style="font-size:13px;color:#e4e9f1;font-weight:600">DribbleUp minutes</span>
        <span style="font-size:12.5px;color:${dribbleMet ? "var(--green)" : "var(--gray)"}">${d.thisWeek.dribbleMin} / <input class="input" id="f-goal-dribbleMinutes" type="number" min="1" value="${state.goals.dribbleMinutes}" oninput="updateGoal('dribbleMinutes', this.value)" style="display:inline-block;width:56px;padding:2px 6px;font-size:12.5px;text-align:center" /> min</span>
      </div>
      <div style="height:8px;border-radius:99px;background:var(--navy-line);overflow:hidden">
        <div style="height:100%;width:${dribblePct}%;background:${dribbleMet ? "var(--green)" : "var(--orange)"};border-radius:99px"></div>
      </div>
    </div>
  </div>`;

  const prevWeekKey = addDays(getMonday(todayStr()), -7);
  const prevWeek = d.weekly.find((w) => w.week === prevWeekKey) || { attempts: 0, makes: 0, points: 0, reps: 0, dribbleMin: 0, shootingPct: null };
  html += `<div class="card">
    <div class="section-label" style="margin:0 0 10px">This Week vs Last Week</div>
    ${trendRow("FG%", d.thisWeek.shootingPct !== null ? `${d.thisWeek.shootingPct}%` : "—", d.thisWeek.shootingPct, prevWeek.shootingPct, "pp")}
    ${trendRow("Shots", d.thisWeek.attempts, d.thisWeek.attempts, prevWeek.attempts, "")}
    ${trendRow("Dribble Pts", d.thisWeek.points, d.thisWeek.points, prevWeek.points, "")}
    ${trendRow("DribbleUp Min", d.thisWeek.dribbleMin, d.thisWeek.dribbleMin, prevWeek.dribbleMin, "")}
  </div>`;

  html += `<div class="card">
    <div class="section-label" style="margin:0 0 10px">${fmtMonthLabel(d.thisMonthKey)} vs Last Month</div>
    ${trendRow("FG%", d.thisMonth.shootingPct !== null ? `${d.thisMonth.shootingPct}%` : "—", d.thisMonth.shootingPct, d.lastMonth.shootingPct, "pp")}
    ${trendRow("Shots", d.thisMonth.attempts, d.thisMonth.attempts, d.lastMonth.attempts, "")}
    ${trendRow("Dribble Pts", d.thisMonth.points, d.thisMonth.points, d.lastMonth.points, "")}
    ${trendRow("DribbleUp Min", d.thisMonth.dribbleMin, d.thisMonth.dribbleMin, d.lastMonth.dribbleMin, "")}
  </div>`;

  if (d.weekly.some((w) => w.shootingPct !== null)) {
    html += `<div class="card" style="padding:14px 8px 6px"><div class="chart-title">Shooting % by Week</div><canvas id="chartFg" height="180"></canvas></div>`;
  }
  if (d.weekly.some((w) => w.hasShooting)) {
    html += `<div class="card" style="padding:14px 8px 6px"><div class="chart-title">Attempts vs Makes</div><canvas id="chartAttempts" height="180"></canvas></div>`;
  }
  if (d.hasZoneData) {
    html += `<div style="display:flex;gap:10px;margin-bottom:14px">
      <div class="zone-pill"><div class="zone-dot" style="background:var(--blue)"></div><div style="font-size:17px;font-weight:700;color:#fff">${d.totalClose}</div><div style="font-size:10px;color:var(--gray)">Close</div></div>
      <div class="zone-pill"><div class="zone-dot" style="background:var(--orange)"></div><div style="font-size:17px;font-weight:700;color:#fff">${d.totalMid}</div><div style="font-size:10px;color:var(--gray)">Mid</div></div>
      <div class="zone-pill"><div class="zone-dot" style="background:var(--green)"></div><div style="font-size:17px;font-weight:700;color:#fff">${d.totalLong}</div><div style="font-size:10px;color:var(--gray)">Long</div></div>
    </div>
    <div class="card" style="padding:14px 8px 6px"><div class="chart-title">Makes by Zone, by Week</div><canvas id="chartZones" height="180"></canvas></div>`;
  }
  if (d.hasZoneAttempts) {
    const zColors = { close: "var(--blue)", mid: "var(--orange)", long: "var(--green)" };
    html += `<div class="card">
      <div class="chart-title" style="padding:0 0 4px">Shooting by Distance</div>
      <div style="font-size:11px;color:var(--gray);margin-bottom:10px">All sessions combined. Swishes counted separately from makes, as DribbleUp reports them.</div>`;
    for (const z of d.zoneStats) {
      if (z.attempts === 0) continue;
      const barPct = z.pct !== null ? Math.min(100, z.pct) : 0;
      html += `<div style="margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px">
          <span style="font-size:12.5px;color:#e4e9f1;font-weight:600">${z.label}</span>
          <span style="font-size:12px;color:var(--gray)">${z.makes}/${z.attempts} · <strong style="color:#fff">${z.pct}%</strong>${z.swishes > 0 ? ` · ${z.swishPct}% swish` : ""}</span>
        </div>
        <div style="height:7px;border-radius:99px;background:var(--navy-line);overflow:hidden">
          <div style="height:100%;width:${barPct}%;background:${zColors[z.zone]};border-radius:99px"></div>
        </div>
      </div>`;
    }
    html += `</div>`;
  }

  if (d.mechanics.length > 0 || d.latestForm) {
    html += `<div class="card">
      <div class="chart-title" style="padding:0 0 4px">Shot Mechanics</div>
      <div style="font-size:11px;color:var(--gray);margin-bottom:10px">Latest session vs. average of previous sessions</div>`;
    for (const m of d.mechanics) {
      let delta = `<span class="trend-delta flat">—</span>`;
      if (m.priorAvg !== null) {
        const diff = m.latest - m.priorAvg;
        // Higher is better for spin rate, shot arc, and intensity. Release
        // time is a "% in range" figure on the DribbleUp screen, so higher
        // is better there too.
        if (diff > 0) delta = `<span class="trend-delta up">▲ ${diff}</span>`;
        else if (diff < 0) delta = `<span class="trend-delta down">▼ ${Math.abs(diff)}</span>`;
        else delta = `<span class="trend-delta flat">— 0</span>`;
      }
      html += `<div class="trend-row">
        <span>
          <span class="trend-label">${m.label}</span>
          <span style="font-size:10.5px;color:var(--gray);display:block;margin-top:1px">${m.priorAvg !== null ? `prev avg ${m.priorAvg}%` : "first session"}</span>
        </span>
        <span><span class="trend-value">${m.latest}%</span>${delta}</span>
      </div>`;
    }
    if (d.latestForm) {
      const total = d.formCounts.Consistent + d.formCounts.Inconsistent;
      const consistentPct = total > 0 ? Math.round((d.formCounts.Consistent / total) * 100) : 0;
      html += `<div class="trend-row">
        <span>
          <span class="trend-label">Shot form</span>
          <span style="font-size:10.5px;color:var(--gray);display:block;margin-top:1px">consistent in ${d.formCounts.Consistent} of ${total} session${total === 1 ? "" : "s"} (${consistentPct}%)</span>
        </span>
        <span class="trend-value" style="color:${(d.latestForm.shotForm || "").toLowerCase() === "consistent" ? "var(--green)" : "#ff8a8a"}">${d.latestForm.shotForm}</span>
      </div>`;
    }
    html += `</div>`;
  }

  if (d.weekly.some((w) => w.hasDribbling)) {
    html += `<div class="card" style="padding:14px 8px 6px"><div class="chart-title">Dribbling Points by Week</div><canvas id="chartPoints" height="180"></canvas></div>`;
  }
  if (d.drillStats.length > 0) {
    html += `<div class="card">
      <div class="chart-title" style="padding:0 0 10px">Dribbling by Drill</div>
      ${d.drillStats.map((drill) => `
        <div class="trend-row">
          <span class="trend-label">${drill.drillName}</span>
          <span style="text-align:right">
            <span class="trend-value">${drill.points} pts</span>
            <span style="font-size:11px;color:var(--gray);display:block;margin-top:1px">${drill.reps} reps · ${drill.sessions} ${drill.sessions === 1 ? "session" : "sessions"}</span>
          </span>
        </div>`).join("")}
    </div>`;
  }

  const calBase = new Date();
  const calDate = new Date(calBase.getFullYear(), calBase.getMonth() + state.calOffset, 1);
  const calYear = calDate.getFullYear(), calMonth = calDate.getMonth();
  const calCells = getMonthMatrix(calYear, calMonth);
  const calLabel = calDate.toLocaleDateString("en-US", { month: "long", year: "numeric" });
  html += `<div class="card" style="padding:14px 8px 6px">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:0 6px 10px">
      <button class="cal-nav-btn" onclick="calPrev()">‹</button>
      <div style="font-size:13px;font-weight:700;color:#fff">${calLabel}</div>
      <button class="cal-nav-btn" ${state.calOffset >= 0 ? "disabled style='opacity:0.3'" : ""} onclick="calNext()">›</button>
    </div>
    <div class="cal-grid" style="padding:0 6px 10px">
      ${["S","M","T","W","T","F","S"].map((x) => `<div class="cal-dow">${x}</div>`).join("")}
      ${calCells.map((cell) => {
        if (!cell) return `<div></div>`;
        const practiced = d.practicedDates.has(cell);
        const isToday = cell === todayStr();
        const dayNum = Number(cell.slice(-2));
        return `<div class="cal-cell"><div class="cal-day ${practiced ? "practiced" : ""} ${isToday ? "today" : ""}">${dayNum}</div></div>`;
      }).join("")}
    </div>
  </div>`;

  html += `<div class="section-label">Session Log</div>`;
  const sortedDesc = [...state.sessions].sort((a, b) => b.date.localeCompare(a.date));
  for (const s of sortedDesc) {
    const title = s.type === "shooting" ? s.label : s.drillName;
    const sub = s.type === "shooting"
      ? `${s.makes}/${s.attempts} (${s.attempts > 0 ? Math.round((s.makes / s.attempts) * 100) : 0}%)${s.swishes != null && s.attempts > 0 ? ` · ${Math.round((s.swishes / s.attempts) * 1000) / 10}% swish` : ""}`
      : `${s.points} pts · ${s.reps} reps`;
    let mechLine = "";
    if (s.type === "shooting") {
      const bits = [];
      if (s.spinRate != null) bits.push(`spin ${s.spinRate}%`);
      if (s.releaseTime != null) bits.push(`release ${s.releaseTime}%`);
      if (s.shotArc != null) bits.push(`arc ${s.shotArc}%`);
      if (s.intensity != null) bits.push(`intensity ${s.intensity}%`);
      if (s.duration != null) bits.push(`${s.duration} min`);
      if (s.shotForm) bits.push(s.shotForm.toLowerCase());
      if (bits.length) mechLine = `<div style="font-size:11px;color:var(--gray);opacity:0.75;margin-top:3px">${bits.join(" · ")}</div>`;
    }
    html += `<div class="session-row">
      <div><div class="session-title">${title}</div><div class="session-sub">${fmtShort(s.date)}${s.time ? ` · ${fmtTime(s.time)}` : ""} · ${sub}</div>${mechLine}</div>
      <button class="del-btn" onclick="handleDelete('${s.id}')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></button>
    </div>`;
  }

  html += renderSyncCard();

  html += `<div style="text-align:center;margin-top:18px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap">
    <button class="btn-link" onclick="printRecap()">Print/share recap</button>
    <button class="btn-link" onclick="exportData()">Export data (JSON)</button>
    <button class="btn-link" onclick="triggerImport()">Import data (JSON)</button>
    <button class="btn-link" onclick="clearAll()">Clear all data</button>
    <button class="btn-link" onclick="setPin()">${getPin() ? "Change/remove PIN" : "Set a PIN"}</button>
  </div>`;

  html += `</div>`;
  return html;
}

function trendRow(label, displayValue, current, previous, unit) {
  let deltaHtml = `<span class="trend-delta flat">—</span>`;
  if (current !== null && previous !== null) {
    const diff = Math.round((current - previous) * 10) / 10;
    if (diff > 0) deltaHtml = `<span class="trend-delta up">▲ ${diff}${unit}</span>`;
    else if (diff < 0) deltaHtml = `<span class="trend-delta down">▼ ${Math.abs(diff)}${unit}</span>`;
    else deltaHtml = `<span class="trend-delta flat">— 0${unit}</span>`;
  }
  return `<div class="trend-row">
    <span class="trend-label">${label}</span>
    <span><span class="trend-value">${displayValue}</span>${deltaHtml}</span>
  </div>`;
}

const MONTH_MAP = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };
const KNOWN_DRILLS = ["Tight Handles", "Two-Ball Series", "Cone Weave", "Live Ball Combo"];

function flattenOcrText(text) {
  return text.replace(/\s+/g, " ").trim();
}

// Parses the "Shots by distance" popup: three stacked bars labelled
// Close-range / Mid-range / Long-range, each with an "N shots" total and
// Swish% / Make% bands. Note: in DribbleUp's model the Make band EXCLUDES
// swishes, so makes and swishes are stored as separate counts.
function parseZoneScreenshot(flat) {
  const out = {};
  // LIMITATION: OCR flattens this popup in visual reading order — the "N shots"
  // captions are read top-down (tallest bar first) while the range labels are
  // read left-to-right. That makes the shots->zone pairing genuinely ambiguous
  // from text alone. The percentages, however, DO come out left-to-right in
  // zone order (all make%, then all swish%), so those are reliable.
  const shotMatches = [...flat.matchAll(/(\d+)\s*shots?\b/gi)].map((m) => ({ n: Number(m[1]), idx: m.index, end: m.index + m[0].length }));
  const labels = [];
  for (const [z, re] of [["close", /Close-?\s?range/i], ["mid", /Mid-?\s?range/i], ["long", /Long-?\s?range/i]]) {
    const m = flat.match(re);
    if (m) labels.push({ zone: z, idx: m.index });
  }
  labels.sort((a, b) => a.idx - b.idx);

  const used = new Set();
  const zoneAttempts = {};
  // Pass 1: a shots caption sitting immediately before a range label (nothing
  // but whitespace between) is unambiguously that zone's — this reliably
  // catches the isolated short bars.
  for (const lab of labels) {
    for (const sm of shotMatches) {
      if (used.has(sm.idx)) continue;
      const between = flat.slice(sm.end, lab.idx);
      if (sm.end <= lab.idx && /^\s*$/.test(between)) {
        zoneAttempts[lab.zone] = sm.n;
        used.add(sm.idx);
        break;
      }
    }
  }
  // Pass 2: remaining captions were read tallest-first, so assign the largest
  // remaining value to the zone that still needs one, in reverse read order.
  const remainingShots = shotMatches.filter((s) => !used.has(s.idx)).map((s) => s.n);
  const remainingZones = labels.map((l) => l.zone).filter((z) => zoneAttempts[z] === undefined);
  const ambiguous = [];
  remainingShots.slice().reverse().forEach((n, i) => {
    const z = remainingZones[i];
    if (z !== undefined) { zoneAttempts[z] = n; ambiguous.push(z); }
  });

  for (const z of ["close", "mid", "long"]) {
    if (zoneAttempts[z] !== undefined) out[z + "Attempts"] = String(zoneAttempts[z]);
  }

  // Percentages come out left-to-right: all make% first, then all swish%.
  // Scope to the popup only — it overlays the main stats screen, whose own
  // "SHOOTING 45%" / "Swishes 17%" figures would otherwise contaminate this.
  const popupIdx = flat.search(/Shots?\s+by\s+distance/i);
  const popupText = popupIdx >= 0 ? flat.slice(popupIdx) : flat;
  const pcts = [...popupText.matchAll(/(\d{1,3})\s*%/g)].map((m) => Number(m[1]));
  // Zones too sparse to render bands (e.g. a 1-shot long-range bar) contribute
  // no percentages, so only the first N zones get pairs.
  const nPairs = Math.floor(pcts.length / 2);
  const orderedZones = labels.map((l) => l.zone).filter((z) => zoneAttempts[z] !== undefined).slice(0, nPairs);
  const half = nPairs;
  orderedZones.forEach((z, i) => {
    const attempts = zoneAttempts[z];
    const makePct = pcts[i];
    const swishPct = pcts[half + i];
    if (makePct !== undefined) out[z + "Makes"] = String(Math.round((attempts * makePct) / 100));
    if (swishPct !== undefined) out[z + "Swishes"] = String(Math.round((attempts * swishPct) / 100));
  });

  const totalAttempts = Object.values(zoneAttempts).reduce((a, n) => a + n, 0);
  if (totalAttempts > 0) out._zoneTotalAttempts = String(totalAttempts);
  if (ambiguous.length > 1) out._zoneAmbiguous = ambiguous;
  return out;
}

function detectScreenshotType(flat) {
  // The zone popup is distinctive: range labels plus the Swish/Make/Miss legend.
  const zoneHits = /Close-?range/i.test(flat) && /Mid-?range/i.test(flat) && /Long-?range/i.test(flat);
  const hasLegend = /\bSwish\b/i.test(flat) && /\bMake\b/i.test(flat) && /\bMiss\b/i.test(flat);
  const byDistance = /Shots?\s+by\s+distance/i.test(flat);
  if (byDistance || (zoneHits && hasLegend)) return "zones";

  const hasShootingWords = /ATTEMPTS/i.test(flat) && /MAKES/i.test(flat);
  const hasDribbleWords = /\bpts\b/i.test(flat) && /\breps\b/i.test(flat);
  if (hasShootingWords) return "shooting";
  if (hasDribbleWords) return "dribbling";
  return null;
}

function numAfter(flat, label) {
  const re = new RegExp(label + "\\D{0,12}?(\\d+(?:\\.\\d+)?)", "i");
  const m = flat.match(re);
  return m ? m[1] : null;
}

function parseShootScreenshot(flat) {
  const out = {};
  // Tracks which fields were calculated rather than read directly off the
  // image, so the UI can show the user how much to trust each value.
  const derived = new Set();

  // OCR on this screen is unreliable for the big stylized numbers in the stats
  // block — they're frequently dropped entirely, and labels often get read as a
  // group separate from their values (e.g. "SPIN RATE RELEASE TIME SHOT ARC"
  // followed by "8% 0% 40%"). So we lean on the most consistently-read sources
  // and cross-derive the rest.

  // 1. Attempts: the coaching tip states it in plain prose ("You took 250
  //    shots"), which OCR reads far more reliably than the stats block.
  const tipM = flat.match(/took\s+(\d+)\s*&?\s*shots?/i);
  out.attempts = tipM ? tipM[1] : null;

  // 2. Overall shooting % from the circle ("SHOOTING 45%" — the % is sometimes
  //    misread as a stray "o").
  const pctM = flat.match(/SHOOTING\s+(\d{1,3})\s*(?:%|o\b|\bo\s)/i);
  const shootingPct = pctM ? Number(pctM[1]) : null;

  // 3. Makes: try to read it directly, tolerating junk between label and value.
  const makesM = flat.match(/MAKES\s*%?\s*(\d+)/i);
  out.makes = makesM ? makesM[1] : null;

  // Fall back to the ATTEMPTS block only if the tip didn't give us attempts.
  if (out.attempts === null) {
    const attemptsIdx = flat.search(/ATTEMPTS/i);
    if (attemptsIdx !== -1) {
      const stopMatch = flat.slice(attemptsIdx).match(/SPIN RATE|RELEASE TIME|SHOT ARC|SHOT FORM|SHOT TYPE|DURATION|TIME ACTIVE|INTENSITY/i);
      const block = stopMatch ? flat.slice(attemptsIdx, attemptsIdx + stopMatch.index) : flat.slice(attemptsIdx);
      const counts = [...block.replace(/\d+\s*%/g, " ").matchAll(/\d+/g)].map((m) => m[0]);
      if (counts[0] !== undefined) out.attempts = counts[0];
      if (out.makes === null && counts[1] !== undefined) out.makes = counts[1];
      if (counts[2] !== undefined) out.swishes = counts[2];
    }
  }

  // 4. Derive/validate makes against the shooting percentage.
  if (out.attempts !== null && shootingPct !== null) {
    const expected = Math.round((Number(out.attempts) * shootingPct) / 100);
    const makesNum = out.makes !== null ? Number(out.makes) : null;
    if (makesNum === null || makesNum > Number(out.attempts) || Math.abs(makesNum - expected) > Math.max(5, expected * 0.2)) {
      out.makes = String(expected);
      out._recovered = true;
      derived.add("makes");
    }
  }

  // 5. Swishes: derive from the "Swishes NN%" line if not already read.
  if ((out.swishes === null || out.swishes === undefined) && out.attempts !== null) {
    const swishPctM = flat.match(/Swishes\s+(\d{1,3})\s*%/i);
    if (swishPctM) {
      out.swishes = String(Math.round((Number(out.attempts) * Number(swishPctM[1])) / 100));
      out._recovered = true;
      derived.add("swishes");
    }
  }
  if (out.swishes === undefined) out.swishes = null;

  // 6. Makes can never exceed attempts.
  if (out.attempts !== null && out.makes !== null && Number(out.makes) > Number(out.attempts)) {
    const tmp = out.attempts;
    out.attempts = out.makes;
    out.makes = tmp;
    out._swapped = true;
  }

  // 7. Three-up metric row: labels are often grouped, then values grouped.
  const tripleM = flat.match(/SPIN RATE\s+RELEASE TIME\s+SHOT ARC\s+(\d+)\s*%\s+(\d+)\s*%\s+(\d+)\s*%/i);
  if (tripleM) {
    out.spinRate = tripleM[1];
    out.releaseTime = tripleM[2];
    out.shotArc = tripleM[3];
  } else {
    const s = flat.match(/SPIN RATE\D{0,10}?(\d+)\s*%/i); out.spinRate = s ? s[1] : null;
    const r = flat.match(/RELEASE TIME\D{0,10}?(\d+)\s*%/i); out.releaseTime = r ? r[1] : null;
    const a = flat.match(/SHOT ARC\D{0,10}?(\d+)\s*%/i); out.shotArc = a ? a[1] : null;
  }

  // 8. Duration + intensity, also often grouped ("TIME ACTIVE INTENSITY 39 min 82%").
  const diM = flat.match(/(?:TIME ACTIVE|DURATION)\s+INTENSITY\s+(\d+)\s*min\s+(\d+)/i);
  if (diM) {
    out.duration = diM[1];
    out.intensity = diM[2];
  } else {
    const d = flat.match(/(?:TIME ACTIVE|DURATION)\D{0,10}?(\d+)\s*min/i); out.duration = d ? d[1] : null;
    const i = flat.match(/INTENSITY\D{0,10}?(\d+)\s*%/i); out.intensity = i ? i[1] : null;
  }

  const formM = flat.match(/\b(Inconsistent|Consistent)\b/i); out.shotForm = formM ? formM[1] : null;
  const typeM = flat.match(/(\d+)\s*%\s*relaxed/i); out.shotType = typeM ? `${typeM[1]}% relaxed` : null;
  out.label = "Shootaround";
  out._derived = Array.from(derived);
  return out;
}

function parseDribbleScreenshot(flat) {
  const out = {};
  let drillName = null;
  for (const d of KNOWN_DRILLS) {
    if (flat.toLowerCase().includes(d.toLowerCase())) { drillName = d; break; }
  }
  if (!drillName) {
    const m = flat.match(/([A-Za-z][A-Za-z '\-]{2,30}?)\s+Basketball\b/i);
    if (m) drillName = m[1].trim();
  }
  out.drillName = drillName;
  const ptsM = flat.match(/(\d+)\s*pts/i); out.points = ptsM ? ptsM[1] : null;
  const repsM = flat.match(/(\d+)\s*reps/i); out.reps = repsM ? repsM[1] : null;
  const dtM = flat.match(/(\w{3}),?\s*(\w{3})\s+(\d{1,2}),\s*(\d{4})\s*(?:at)?\s*(\d{1,2}):(\d{2})\s*([AP]M)/i);
  if (dtM) {
    const monthIdx = MONTH_MAP[dtM[2].toLowerCase().slice(0, 3)];
    if (monthIdx !== undefined) {
      const year = dtM[4], day = dtM[3].padStart(2, "0"), month = String(monthIdx + 1).padStart(2, "0");
      let hour = parseInt(dtM[5], 10);
      const minute = dtM[6];
      const ampm = dtM[7].toUpperCase();
      if (ampm === "PM" && hour !== 12) hour += 12;
      if (ampm === "AM" && hour === 12) hour = 0;
      out.date = `${year}-${month}-${day}`;
      out.time = `${String(hour).padStart(2, "0")}:${minute}`;
    }
  }
  return out;
}

// Returns the CSS class marking whether a field was read directly from the
// screenshot, calculated from other values, or left alone.
function ocrClass(s, key) {
  if (s._ocrDerived && s._ocrDerived.includes(key)) return " ocr-derived";
  if (s._ocrFilled && s._ocrFilled.includes(key)) return " ocr-read";
  return "";
}
function ocrTag(s, key) {
  if (s._ocrDerived && s._ocrDerived.includes(key)) return `<span class="field-tag derived">calc'd</span>`;
  if (s._ocrFilled && s._ocrFilled.includes(key)) return `<span class="field-tag read">scanned</span>`;
  return "";
}

function fieldHtml(label, inputHtml, required) {
  return `<div class="field"><label>${label}${required ? " *" : ""}</label>${inputHtml}</div>`;
}

function renderLogForm() {
  const s = state.shooting, dr = state.dribbling;
  let html = `<div style="padding:0 20px">`;

  html += `<div class="import-card">
    <input type="file" id="f-screenshot" accept="image/*" multiple style="display:none" onchange="handleScreenshotImport(this)" ${state.ocrBusy ? "disabled" : ""} />
