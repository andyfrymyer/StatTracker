    <div class="import-status">${state.ocrBusy ? `<span class="spin"></span>${state.ocrStatus}` : "Pick one or both DribbleUp screens at once — stats and &quot;Shots by distance&quot;"}</div>
    ${state.lastOcrRaw ? `
      <button class="btn-link" style="margin-top:10px" onclick="toggleOcrDebug()">${state.showOcrDebug ? "Hide" : "Show"} raw OCR text (debug)</button>
      ${state.showOcrDebug ? `
        <div style="margin-top:10px;text-align:left">
          <textarea readonly id="f-ocr-raw" style="width:100%;height:150px;background:#0a1526;border:1px solid var(--navy-line);border-radius:8px;color:#cbd3e0;font-family:monospace;font-size:11px;padding:8px;line-height:1.4">${state.lastOcrRaw.replace(/</g, "&lt;")}</textarea>
          <button class="btn-ghost" style="margin-top:8px;width:100%;padding:8px" onclick="copyOcrRaw()">Copy raw text</button>
        </div>` : ""}
    ` : ""}
  </div>`;

  html += `<div class="row" style="margin-bottom:18px">
    <button class="seg-btn ${state.type === "shooting" ? "active" : ""}" onclick="setType('shooting')">Shooting</button>
    <button class="seg-btn ${state.type === "dribbling" ? "active" : ""}" onclick="setType('dribbling')">Dribbling</button>
  </div>`;

  html += `<div class="row">
    ${fieldHtml("Date", `<input class="input" id="f-date" type="date" value="${state.date}" max="${todayStr()}" oninput="updateDate(this.value)" />`)}
    ${fieldHtml("Time", `<input class="input" id="f-time" type="time" value="${state.time}" oninput="updateTime(this.value)" />`)}
  </div>`;

  if (state.type === "shooting") {
    html += fieldHtml("Session name", `<input class="input" id="f-shooting-label" type="text" value="${s.label}" placeholder="Shootaround" oninput="updateShooting('label', this.value)" />`);
    if ((s._ocrFilled && s._ocrFilled.length) || (s._ocrDerived && s._ocrDerived.length)) {
      html += `<div class="ocr-legend">
        <span><span class="legend-dot" style="background:var(--green)"></span>Scanned — read directly off the screenshot</span>
        <span><span class="legend-dot" style="background:#d9a441"></span>Calc'd — worked out from other numbers, double-check</span>
        <span><span class="legend-dot" style="background:var(--navy-line)"></span>Unmarked — not found, enter manually</span>
      </div>`;
    }
    if (s._ocrLowConfidence || s._ocrSwapped) {
      html += `<div style="background:rgba(244,123,32,0.12);border:1px solid var(--orange);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:12.5px;color:#ffd9b3;line-height:1.5">
        ⚠️ ${s._ocrSwapped ? "Attempts/Makes looked swapped and were auto-corrected." : "Couldn't clearly read all 3 numbers (Attempts/Makes/Swishes) from the screenshot."} Please check these against the actual screenshot before saving.
      </div>`;
    }
    html += `<div class="row">
      ${fieldHtml("Attempts" + ocrTag(s, "attempts"), `<input class="input${ocrClass(s, "attempts")}" id="f-shooting-attempts" type="number" min="0" value="${s.attempts}" oninput="updateShooting('attempts', this.value)" />`, true)}
      ${fieldHtml("Makes" + ocrTag(s, "makes"), `<input class="input${ocrClass(s, "makes")}" id="f-shooting-makes" type="number" min="0" value="${s.makes}" oninput="updateShooting('makes', this.value)" />`, true)}
    </div>`;
    const swishPct = (s.swishes !== "" && s.attempts !== "" && Number(s.attempts) > 0)
      ? `<div style="font-size:11px;color:var(--orange);margin-top:4px">≈ ${Math.round((Number(s.swishes) / Number(s.attempts)) * 1000) / 10}% of attempts</div>` : "";
    html += `<div class="row">
      ${fieldHtml("Swishes" + ocrTag(s, "swishes"), `<input class="input${ocrClass(s, "swishes")}" id="f-shooting-swishes" type="number" min="0" value="${s.swishes}" oninput="updateShooting('swishes', this.value)" />${swishPct}`)}
      ${fieldHtml("Duration (min)" + ocrTag(s, "duration"), `<input class="input${ocrClass(s, "duration")}" id="f-shooting-duration" type="number" min="0" value="${s.duration}" oninput="updateShooting('duration', this.value)" />`)}
    </div>`;
    html += `<div class="field">
      <label>Shots by distance ${ocrTag(s, "closeAttempts")}</label>
      <div style="font-size:10.5px;color:var(--gray);margin:-2px 0 8px">Attempts / makes / swishes per zone. Import the "Shots by distance" popup to fill automatically.</div>
      ${["close", "mid", "long"].map((z) => {
        const name = z === "close" ? "Close" : z === "mid" ? "Mid" : "Long";
        return `<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
          <span style="font-size:11.5px;color:var(--gray);width:42px;flex-shrink:0">${name}</span>
          <input class="input${ocrClass(s, z + "Attempts")}" id="f-shooting-${z}Attempts" type="number" min="0" placeholder="att" value="${s[z + "Attempts"] || ""}" oninput="updateShooting('${z}Attempts', this.value)" style="margin-top:0" />
          <input class="input${ocrClass(s, z + "Makes")}" id="f-shooting-${z}Makes" type="number" min="0" placeholder="make" value="${s[z + "Makes"] || ""}" oninput="updateShooting('${z}Makes', this.value)" style="margin-top:0" />
          <input class="input${ocrClass(s, z + "Swishes")}" id="f-shooting-${z}Swishes" type="number" min="0" placeholder="swish" value="${s[z + "Swishes"] || ""}" oninput="updateShooting('${z}Swishes', this.value)" style="margin-top:0" />
        </div>`;
      }).join("")}
    </div>`;
    html += `<div class="row">
      ${fieldHtml("Spin rate (%)" + ocrTag(s, "spinRate"), `<input class="input${ocrClass(s, "spinRate")}" id="f-shooting-spinRate" type="number" min="0" max="100" value="${s.spinRate}" oninput="updateShooting('spinRate', this.value)" />`)}
      ${fieldHtml("Release time (%)" + ocrTag(s, "releaseTime"), `<input class="input${ocrClass(s, "releaseTime")}" id="f-shooting-releaseTime" type="number" min="0" max="100" value="${s.releaseTime}" oninput="updateShooting('releaseTime', this.value)" />`)}
    </div>`;
    html += `<div class="row">
      ${fieldHtml("Shot arc (%)" + ocrTag(s, "shotArc"), `<input class="input${ocrClass(s, "shotArc")}" id="f-shooting-shotArc" type="number" min="0" max="100" value="${s.shotArc}" oninput="updateShooting('shotArc', this.value)" />`)}
      ${fieldHtml("Intensity (%)" + ocrTag(s, "intensity"), `<input class="input${ocrClass(s, "intensity")}" id="f-shooting-intensity" type="number" min="0" max="100" value="${s.intensity}" oninput="updateShooting('intensity', this.value)" />`)}
    </div>`;
    html += fieldHtml("Shot form" + ocrTag(s, "shotForm"), `<input class="input${ocrClass(s, "shotForm")}" id="f-shooting-shotForm" type="text" value="${s.shotForm}" placeholder="Consistent / Inconsistent" oninput="updateShooting('shotForm', this.value)" />`);
  } else {
    html += fieldHtml("Drill name", `<input class="input" id="f-dribbling-drillName" type="text" value="${dr.drillName}" placeholder="Tight Handles" oninput="updateDribbling('drillName', this.value)" />`);
    html += `<div class="row">
      ${fieldHtml("Points", `<input class="input" id="f-dribbling-points" type="number" min="0" value="${dr.points}" oninput="updateDribbling('points', this.value)" />`, true)}
      ${fieldHtml("Reps", `<input class="input" id="f-dribbling-reps" type="number" min="0" value="${dr.reps}" oninput="updateDribbling('reps', this.value)" />`, true)}
    </div>`;
    html += fieldHtml("Duration (min)", `<input class="input" id="f-dribbling-duration" type="number" min="0" value="${dr.duration}" oninput="updateDribbling('duration', this.value)" />`);
  }

  if (state.error) html += `<div style="color:#ff8a8a;font-size:12.5px;margin-bottom:10px">${state.error}</div>`;
  html += `<button class="btn-primary" style="width:100%;margin-top:6px" onclick="handleAdd()">Log Session</button>`;
  html += `</div>`;
  return html;
}

/* ---------- charts ---------- */
function drawCharts() {
  const d = computeDerived();
  const gray = "#8a96a8", navyLine = "#233a56", orange = "#f47b20", navyLightBar = "#233a56";
  Chart.defaults.font.family = "'Inter', sans-serif";

  if (document.getElementById("chartFg")) {
    destroyChart("fg");
    charts.fg = new Chart(document.getElementById("chartFg"), {
      type: "line",
      data: { labels: d.weekly.map((w) => w.label), datasets: [{ label: "FG%", data: d.weekly.map((w) => w.shootingPct), borderColor: orange, backgroundColor: orange, tension: 0.35, spanGaps: true, pointRadius: 3 }] },
      options: { responsive: true, plugins: { legend: { display: false } }, scales: {
        x: { ticks: { color: gray, font: { size: 10 } }, grid: { color: navyLine } },
        y: { min: 0, max: 100, ticks: { color: gray, font: { size: 10 } }, grid: { color: navyLine } }
      } }
    });
  }
  if (document.getElementById("chartAttempts")) {
    destroyChart("attempts");
    charts.attempts = new Chart(document.getElementById("chartAttempts"), {
      type: "bar",
      data: { labels: d.weekly.map((w) => w.label), datasets: [
        { label: "Attempts", data: d.weekly.map((w) => w.attempts), backgroundColor: navyLightBar },
        { label: "Makes", data: d.weekly.map((w) => w.makes), backgroundColor: orange }
      ] },
      options: { responsive: true, plugins: { legend: { labels: { color: gray, font: { size: 11 } } } }, scales: {
        x: { ticks: { color: gray, font: { size: 10 } }, grid: { display: false } },
        y: { ticks: { color: gray, font: { size: 10 } }, grid: { color: navyLine } }
      } }
    });
  }
  if (document.getElementById("chartZones")) {
    destroyChart("zones");
    charts.zones = new Chart(document.getElementById("chartZones"), {
      type: "bar",
      data: { labels: d.weekly.map((w) => w.label), datasets: [
        { label: "Close", data: d.weekly.map((w) => w.close), backgroundColor: "#5b9bd5" },
        { label: "Mid", data: d.weekly.map((w) => w.mid), backgroundColor: orange },
        { label: "Long", data: d.weekly.map((w) => w.long), backgroundColor: "#5fd0a5" }
      ] },
      options: { responsive: true, plugins: { legend: { labels: { color: gray, font: { size: 11 } } } }, scales: {
        x: { stacked: true, ticks: { color: gray, font: { size: 10 } }, grid: { display: false } },
        y: { stacked: true, ticks: { color: gray, font: { size: 10 } }, grid: { color: navyLine } }
      } }
    });
  }
  if (document.getElementById("chartPoints")) {
    destroyChart("points");
    charts.points = new Chart(document.getElementById("chartPoints"), {
      type: "bar",
      data: { labels: d.weekly.map((w) => w.label), datasets: [{ label: "Points", data: d.weekly.map((w) => w.points), backgroundColor: orange }] },
      options: { responsive: true, plugins: { legend: { display: false } }, scales: {
        x: { ticks: { color: gray, font: { size: 10 } }, grid: { display: false } },
        y: { ticks: { color: gray, font: { size: 10 } }, grid: { color: navyLine } }
      } }
    });
  }
}

/* ---------- init ---------- */
load();
render();
syncFromApi();
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
